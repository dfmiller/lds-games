<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game template</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
/* Colors: change these tokens to re-skin. Dark values are in the two blocks below. */
:root{--bg:#e9efee;--panel:#fbfdfc;--ink:#12302d;--mute:#5d7a76;--line:#b9cbc7;--bold:#12302d;--sel:#ffd978;--peer:#dcebe8;--same:#bfe0d9;--given:#12302d;--mine:#1b6e8a;--err:#d64545;--btn:#12302d;--btnink:#f2faf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1716;--panel:#16231f;--ink:#e3f1ee;--mute:#8aa6a1;--line:#2c4540;--bold:#9bbcb6;--sel:#8a6a12;--peer:#1d2f2b;--same:#2a4a44;--given:#e3f1ee;--mine:#6cc3e0;--err:#ff7b7b;--btn:#e3f1ee;--btnink:#0e1716}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:14px 12px 24px}
header{position:relative;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hl{display:flex;align-items:center;gap:6px}
#hb{display:flex;border:0;background:none;color:var(--ink);padding:6px;margin-left:-6px;border-radius:8px;cursor:pointer}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.stats{display:flex;gap:14px;color:var(--mute);font-size:15px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
#tm,#ms{display:inline-block}#ms{transform-origin:right center}
.pop{animation:pop2 .9s}@keyframes pop2{0%,100%{transform:scale(1)}30%{transform:scale(2.5)}}
#board{display:grid;aspect-ratio:var(--ar,1);width:100%;background:var(--panel);border:2.5px solid var(--bold);border-radius:6px;overflow:hidden;touch-action:manipulation}
.c{position:relative;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);color:var(--mine);font:inherit;font-size:clamp(20px,6.4vw,30px);font-weight:600;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:0}
.c.rb{border-right:2.5px solid var(--bold)}.c.bb{border-bottom:2.5px solid var(--bold)}.c.re{border-right:0}.c.be{border-bottom:0}
/* Cell state classes returned by G.cell(): add your own below */
.c.sel{background:var(--sel);color:var(--ink)}.c.p{background:var(--peer)}.c.s2{background:var(--same)}
.c.lit{background:var(--sel)}.c.bad{color:var(--err)}
.c.flash::after{content:"";position:absolute;inset:0;background:var(--mine);opacity:0;pointer-events:none;animation:fl .6s ease-out}
@keyframes fl{0%{opacity:.6}100%{opacity:0}}
.pad{display:grid;gap:5px;margin-top:7px}
.pad button{position:relative;aspect-ratio:3/4;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;font:inherit;font-size:clamp(20px,6vw,26px);font-weight:600;cursor:pointer;padding:0}
.pad button small{position:absolute;bottom:3px;left:0;right:0;font-size:10px;font-weight:400;color:var(--mute)}
.pad button:disabled{opacity:.28;cursor:default}
.tools{display:none;position:absolute;top:100%;left:0;z-index:15;min-width:190px;margin-top:6px;padding:6px;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.tools.open{display:flex}
.tools button{border:0;background:none;color:var(--ink);font:inherit;font-size:16px;text-align:left;padding:12px 14px;border-radius:8px;cursor:pointer}
.tools button{display:flex;align-items:center;gap:12px}.tools button svg{flex:none}
.tools button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.tools button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--mine);outline-offset:2px}
#st{min-height:20px;margin:10px 2px 0;color:var(--mute);font-size:14px;text-align:center;line-height:1.35}
#ov{position:fixed;inset:0;background:rgba(8,16,15,.62);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
#ov.show{display:flex}
#ov div{background:var(--panel);border-radius:16px;padding:26px 24px;text-align:center;max-width:320px;width:100%}
#ov h2{margin:0 0 6px;font-size:26px;font-weight:800}
#ov p{margin:0 0 18px;color:var(--mute);font-size:16px;line-height:1.4}
#ov .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#ov.ask .row+.row{margin-top:10px}
#ov #lvls button{flex:1;padding:12px 8px}
#ov button{border:0;background:var(--btn);color:var(--btnink);font:inherit;font-size:16px;font-weight:600;padding:12px 22px;border-radius:10px;cursor:pointer}
#ov button.alt{background:none;color:var(--ink);border:1px solid var(--line)}
#ov #lvls button{background:none;color:var(--ink);border:1px solid var(--line)}#ov #lvls button.cur{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
#ov #oc{border:0;background:none;padding:6px;font-weight:400;font-size:15px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
#oc{display:none}#ov.ask #oc{display:inline-block}
#hw{position:fixed;inset:0;background:rgba(8,16,15,.62);display:none;align-items:center;justify-content:center;padding:24px;z-index:25}
#hw.show{display:flex}
#hw .box{background:var(--panel);border-radius:16px;padding:26px 24px;max-width:340px;width:100%;max-height:80vh;overflow:auto}
#hw h2{margin:0 0 12px;font-size:24px;font-weight:800;text-align:center}
#hw .hp{color:var(--ink);font-size:16px;line-height:1.45}
#hw .hp p{margin:0 0 10px}#hw .hp ul{margin:0 0 10px;padding-left:20px}#hw .hp li{margin-bottom:4px}
#hw .box>button{display:block;margin:16px auto 0;border:0;background:var(--btn);color:var(--btnink);font:inherit;font-size:16px;font-weight:600;padding:12px 28px;border-radius:10px;cursor:pointer}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;display:none}
@media (prefers-reduced-motion:reduce){.pop,.c.flash::after{animation:none}}
#board.jig{display:block;aspect-ratio:auto;margin:0 auto;touch-action:none;overflow:hidden}
#board canvas{display:block;width:100%;height:100%;touch-action:none}
#pk{position:fixed;inset:0;background:rgba(8,16,15,.62);display:none;align-items:center;justify-content:center;padding:24px;z-index:25}
#pk.show{display:flex}
#pk .box{background:var(--panel);border-radius:16px;padding:22px 18px;max-width:380px;width:100%;max-height:85vh;max-height:85dvh;overflow:hidden;display:flex;flex-direction:column}
#pk .box>:not(#pg){flex:none}
#pk h2{margin:0 0 6px;font-size:24px;font-weight:800;text-align:center}
#pk p{margin:0 0 12px;color:var(--mute);font-size:14px;text-align:center;line-height:1.4}
#pk a{color:var(--ink)}
#pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start;grid-auto-rows:max-content;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width: none}
#pg button{padding:0;border:0;background:var(--peer);border-radius:8px;overflow:hidden;cursor:pointer;outline-offset:-3px;display:block;width:100%}
#pg img{width:100%;aspect-ratio:1;height:auto;object-fit:cover;display:block}
#pg button.cur{outline:3px solid var(--mine)}
#pk .box>button{display:block;margin:16px auto 0;border:0;background:var(--btn);color:var(--btnink);font:inherit;font-size:16px;font-weight:600;padding:12px 28px;border-radius:10px;cursor:pointer}
</style>
<script defer src="../vercel-analytics.js"></script>
</head>
<body>
<main>
<header><div class="hl"><button id="hb" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h1 id="ti"></h1></div><div class="tools" id="tools"></div><div class="stats"><span>Time <b id="tm">0:00</b></span><span><span id="sl"></span> <b id="ms">0</b></span></div></header>
<div id="board" class="jig"></div>
<div class="pad" id="pad"></div>

<p id="st"></p>
</main>
<canvas id="fw"></canvas>
<div id="hw" role="dialog" aria-modal="true" aria-labelledby="ht"><div class="box"><h2 id="ht">How to play</h2><div class="hp" id="hc"></div><button id="hx">Got it</button></div></div>
<div id="pk" role="dialog" aria-modal="true" aria-labelledby="pt"><div class="box"><h2 id="pt">Choose picture</h2><p>Picking a picture starts a new game.</p><div id="pg"></div><p style="margin:12px 0 0">Images provided by <a href="https://www.etsy.com/shop/BringTheTempleHome" target="_blank" rel="noopener">Bring The Temple Home</a></p><button id="px">Close</button></div></div>
<div id="ov"><div><h2 id="ot"></h2><p id="op"></p><span class="row" id="lvls"></span><span class="row"><button id="oc" class="alt">Keep Playing</button></span></div></div>
<script src="./temples/backgrounds.js"></script>
<script>
/* =====================================================================
   GAME DEFINITION: Jigsaws Unlimited (canvas board, drag pieces)
   State S is plain JSON: {img, pc, pa, X, Y, V, Hs, Vs, pieces:[{i,j,x,y,s}], fin}
   Piece coordinates are in "picture widths": the picture is 1 wide and pa tall.
   ===================================================================== */
const ico=p=>'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const IC={reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',plus:'<path d="M12 5v14M5 12h14"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4.2"/><path d="M12 17.5h.01"/>',dot:'<circle cx="12" cy="12" r="3"/>'};
Object.assign(IC,{
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  grid:'<rect x="4" y="4" width="16" height="16" rx="1"/><path d="M12 4v16M4 12h16"/>',
  tray:'<path d="M12 4v11M7 11l5 5 5-5M4 20h16"/>',
  shuf:'<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'
});
/* Pictures live in a temples/ folder next to this file. */
const TEMPLES = window.TEMPLES
const NAMES=TEMPLES,FILES=Object.keys(TEMPLES);
const TRAY=.3,LV=[2,3,5,7];            // tray height under the picture; pieces-per-side setting for each level
const rnd=(a,b)=>a+Math.random()*(b-a),r4=v=>Math.round(v*1e4)/1e4;
let cv,cx,pic=null,dpr=1,sc=1,bw=0,sig='',imgEl=null,imgPath='',loadingPath='',outl=true,showPrev=false,drag=null,rq=0,finT=0,pending=null,pcache=[],pcFor=null;
try{outl=localStorage.getItem('jigsaws-outl')!=='0'}catch(e){}
const jb=document.getElementById('board');
cv=document.createElement('canvas');cx=cv.getContext('2d');jb.append(cv);cv.oncontextmenu=e=>e.preventDefault();

const cropRect=(nw,nh)=>{let sw=nw,sh=nh;if(nw>nh)sw=nh;if(sh/sw>1.34)sh=sw*1.34;return[(nw-sw)/2,(nh-sh)/2,sw,sh]};
function loadImg(path,cb){
  if(imgEl&&imgPath===path&&imgEl.naturalWidth){cb(imgEl);return}
  const im=new Image();
  im.onload=()=>{imgEl=im;imgPath=path;cb(im)};
  im.onerror=()=>cb(null);
  im.src='./temples/'+path;
  console.log(im.src)
}
function build(st,im){
  const[,,sw,sh]=cropRect(im.naturalWidth,im.naturalHeight);
  st.pa=r4(sh/sw);
  const X=st.pc+1,Y=Math.ceil((st.pc+1)*1.33),w=1/X,h=st.pa/Y;
  st.X=X;st.Y=Y;st.Hs=[];st.Vs=[];st.V=[];
  for(let j=0;j<=Y;j++)for(let i=0;i<X;i++)st.Hs.push(j==0||j==Y?0:Math.random()<.5?1:-1);
  for(let j=0;j<Y;j++)for(let i=0;i<=X;i++)st.Vs.push(i==0||i==X?0:Math.random()<.5?1:-1);
  for(let j=0;j<=Y;j++)for(let i=0;i<=X;i++){const e=i==0||j==0||i==X||j==Y;st.V.push(e?0:r4(rnd(-.08,.08)*w),e?0:r4(rnd(-.08,.08)*h))}
  st.pieces=[];
  for(let j=0;j<Y;j++)for(let i=0;i<X;i++)st.pieces.push({i,j,x:0,y:0,s:0});
  st.pieces.sort(()=>Math.random()-.5);
  arrange(st,true);
}
function arrange(st,tray){
  const w=1/st.X,h=st.pa/st.Y,TH=st.pa+TRAY;
  st.pieces.forEach(p=>{if(p.s)return;
    p.x=r4(rnd(0,1-w));
    p.y=r4(tray?TH-h-rnd(0,Math.max(0,TRAY-h)):rnd(0,Math.max(0,st.pa-h)))});
}
function prepare(){
  if(!S)return true;
  if(S.err)return false;
  const have=imgEl&&imgPath===S.img&&imgEl.naturalWidth;
  if(S.pieces&&have)return true;          // pieces built and image ready
  if(loadingPath===S.img)return false;    // already loading
  loadingPath=S.img;const st=S;
  loadImg(S.img,im=>{
    loadingPath='';
    if(S!==st)return;
    if(!im){
      const k=FILES.indexOf(st.img);if(k>-1)FILES.splice(k,1);
      if(!FILES.length){st.err=1;toast('No pictures could be loaded.');return}
      st.img=FILES[Math.max(k,0)%FILES.length];
      st.pieces=null;                      // saved pieces were cut for the old picture
      draw();return;
    }
    if(!st.pieces)build(st,im);            // only build for a brand-new game
    save();draw();
  });
  return false;
}
/* Piece outline in solved-picture space; neighbours share edges exactly, so they interlock. */
function pathOf(p){
  if(pcFor!==S){pcache=[];pcFor=S}
  const k=p.j*S.X+p.i;if(pcache[k])return pcache[k];
  const{X,Y,pa,V,Hs,Vs}=S,w=1/X,h=pa/Y,path=new Path2D();
  const vt=(i,j)=>{const q=(j*(X+1)+i)*2;return[i*w+V[q],j*h+V[q+1]]};
  function edge(P,Q,s){
    if(!s){path.lineTo(Q[0],Q[1]);return}
    const ux=Q[0]-P[0],uy=Q[1]-P[1],nx=-uy,ny=ux;
    const q=(a,b)=>[P[0]+ux*a+nx*b*s,P[1]+uy*a+ny*b*s];
    const c=(a,b,c2,d,e,f)=>{const m=q(a,b),n=q(c2,d),o=q(e,f);path.bezierCurveTo(m[0],m[1],n[0],n[1],o[0],o[1])};
    c(.2,0,.5,-.1,.4,.1);c(.3,.3,.7,.3,.6,.1);c(.5,-.1,.8,0,1,0);
  }
  const{i,j}=p,A=vt(i,j),B=vt(i+1,j),C=vt(i+1,j+1),D=vt(i,j+1);
  path.moveTo(A[0],A[1]);
  edge(A,B,Hs[j*X+i]);edge(B,C,Vs[j*(X+1)+i+1]);edge(C,D,-Hs[(j+1)*X+i]);edge(D,A,-Vs[j*(X+1)+i]);
  path.closePath();
  return pcache[k]=path;
}
const allSolved=s=>!!(s&&s.pieces&&s.pieces.every(p=>p.s));
/* Size the canvas to fit the screen (picture + tray underneath). */
function layout(){
  const pa=(S&&S.pa)||1,TH=pa+TRAY,mainW=document.querySelector('main').clientWidth-24;
  const top=jb.getBoundingClientRect().top+scrollY,avail=innerHeight-top-62;
  const want=Math.floor(Math.max(220,Math.min(mainW,avail/TH+5)));
  const d=Math.min(devicePixelRatio||1,2.5);
  const key=[want,pa,d,S&&S.img,imgPath].join('|');if(key===sig)return;sig=key;
  bw=want-5;dpr=d;
  jb.style.width=want+'px';jb.style.height=(Math.round(bw*TH)+5)+'px';
  cv.width=Math.round(bw*d);cv.height=Math.round(bw*TH*d);sc=cv.width;
  pic=null;
  if(S&&S.pieces&&imgEl&&imgPath===S.img&&imgEl.naturalWidth){
    const[sx,sy,sw,sh]=cropRect(imgEl.naturalWidth,imgEl.naturalHeight);
    pic=document.createElement('canvas');pic.width=cv.width;pic.height=Math.round(pa*cv.width);
    pic.getContext('2d').drawImage(imgEl,sx,sy,sw,sh,0,0,pic.width,pic.height);
  }
}
function render(){
  rq=0;if(!S)return;
  const css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();
  const pa=S.pa||1,u=1/bw;
  cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
  cx.setTransform(sc,0,0,sc,0,0);
  cx.fillStyle=col('--peer');cx.fillRect(0,0,1,pa);
  cx.fillStyle=col('--panel');cx.fillRect(0,pa,1,TRAY);
  cx.fillStyle=col('--line');cx.fillRect(0,pa,1,u*1.5);
  if(!S.pieces||!pic)return;
  const w=1/S.X,h=pa/S.Y,done=allSolved(S);
  if(outl&&!done){
    cx.save();cx.globalAlpha=.6;cx.lineWidth=u;cx.strokeStyle=col('--mute');
    S.pieces.forEach(p=>cx.stroke(pathOf(p)));cx.restore();
  }
  S.pieces.forEach(p=>{if(!p.s)return;
    cx.save();cx.clip(pathOf(p));cx.drawImage(pic,0,0,1,pa);cx.restore()});
  if(done){cx.drawImage(pic,0,0,1,pa);return}
  S.pieces.forEach(p=>{if(p.s)return;
    const dx=p.x-p.i*w,dy=p.y-p.j*h,path=pathOf(p),me=drag&&drag.p===p;
    cx.save();cx.translate(dx,dy);
    if(drag&&!me)cx.globalAlpha=.3;
    else{cx.shadowColor='rgba(0,0,0,.5)';cx.shadowBlur=(me?12:6)*dpr;cx.shadowOffsetX=cx.shadowOffsetY=(me?4:2)*dpr;cx.fillStyle='#888';cx.fill(path);cx.shadowColor='transparent'}
    cx.save();cx.clip(path);cx.drawImage(pic,0,0,1,pa);cx.restore();
    cx.lineJoin='round';
    cx.lineWidth=3*u;cx.strokeStyle='rgba(255,255,255,.55)';cx.stroke(path);
    cx.lineWidth=1*u;cx.strokeStyle='rgba(0,0,0,.6)';cx.stroke(path);
    cx.restore()});
  if(showPrev){cx.drawImage(pic,0,0,1,pa);cx.lineWidth=2*u;cx.strokeStyle=col('--bold');cx.strokeRect(0,0,1,pa)}
}
const rr=()=>{if(!rq)rq=requestAnimationFrame(render)};
/* Pointer handling */
function pt(e){const r=cv.getBoundingClientRect(),TH=(S.pa||1)+TRAY;return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height*TH]}
function hit(x,y){
  const w=1/S.X,h=S.pa/S.Y;let found=-1;
  cx.setTransform(sc,0,0,sc,0,0);
  for(let k=S.pieces.length-1;k>=0;k--){const p=S.pieces[k];if(p.s)continue;
    if(cx.isPointInPath(pathOf(p),(x-(p.x-p.i*w))*sc,(y-(p.y-p.j*h))*sc)){found=k;break}}
  cx.setTransform(1,0,0,1,0,0);return found;
}
cv.addEventListener('pointerdown',e=>{
  if(over||!S||!S.pieces||!pic)return;
  if(showPrev){showPrev=false;draw();return}
  const[x,y]=pt(e),k=hit(x,y);if(k<0)return;
  const p=S.pieces.splice(k,1)[0];S.pieces.push(p);
  drag={p,ox:x-p.x,oy:y-p.y,id:e.pointerId};
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();rr();
});
cv.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const[x,y]=pt(e),w=1/S.X,h=S.pa/S.Y,TH=S.pa+TRAY;
  drag.p.x=Math.min(Math.max(0,x-drag.ox),1-w);drag.p.y=Math.min(Math.max(0,y-drag.oy),TH-h);rr();
});
function release(e){
  if(!drag||e.pointerId!==drag.id)return;
  const p=drag.p,w=1/S.X,h=S.pa/S.Y,sx=p.i*w,sy=p.j*h,tol=Math.min(.05,.3*Math.min(w,h));
  drag=null;
  if(Math.abs(p.x-sx)<=tol&&Math.abs(p.y-sy)<=tol){p.x=sx;p.y=sy;p.s=1;pulse('#ms')}
  else{p.x=r4(p.x);p.y=r4(p.y)}
  after();
}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
addEventListener('resize',()=>{if(S){layout();render()}});
addEventListener('load',()=>{if(S){layout();render()}});
/* Picture chooser */
const pk=document.getElementById('pk');
function openPick(){
  const g=document.getElementById('pg');g.innerHTML='';
  FILES.forEach(f=>{
    const b=document.createElement('button'),im=new Image();
    im.loading='lazy';im.src='./temples/'+f;im.alt=NAMES[f];b.title=NAMES[f];b.setAttribute('aria-label',NAMES[f]);
    if(S&&f===S.img)b.className='cur';
    b.onclick=()=>{pk.classList.remove('show');pending=f;newGame()};
    b.append(im);g.append(b);
    console.log(im.src)
  });
  pk.classList.add('show');
}
document.getElementById('px').onclick=()=>pk.classList.remove('show');
pk.onclick=e=>{if(e.target===pk)pk.classList.remove('show')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')pk.classList.remove('show')});
let fireT=0;
const G={
  id:'jigsaws',
  title:'Jigsaws Unlimited',
  levels:['Easy','Medium','Hard','Expert'],
  rows:0, cols:0,
  box:null,
  statLabel:'Placed',
  pad:null,
  tools:[
    {id:'prev',label:S=>'Preview',icon:IC.eye,on:()=>showPrev,disabled:S=>!S.pieces},
    {id:'pick',label:S=>'Choose picture',icon:IC.img},
    {id:'outl',label:S=>'Show outlines',icon:IC.grid,on:()=>outl},
    {id:'clear',label:S=>'Clear board',icon:IC.tray,disabled:S=>!S.pieces},
    {id:'scat',label:S=>'Scatter pieces',icon:IC.shuf,disabled:S=>!S.pieces}
  ],
  help:'<p>Drag each piece to where it belongs in the picture.</p><ul><li>A piece locks in place when it is close to its spot.</li><li>While you drag, the other pieces fade so you can see the outlines.</li><li><b>Preview</b> shows the finished picture; tap it to hide it.</li><li><b>Clear board</b> sweeps loose pieces down to the tray, and <b>Scatter pieces</b> spreads them back over the picture.</li><li>Easy has 12 pieces, Medium 24, Hard 48 and Expert 88. Every new game uses the next picture.</li></ul>',
  newState(level){
    console.log({ level })
    let f='';
    if(pending&&FILES.includes(pending))f=pending;
    else if(FILES.length){let last='';try{last=localStorage.getItem('jigsaws-img')||''}catch(e){}f=FILES[(FILES.indexOf(last)+1)%FILES.length]}
    pending=null;showPrev=false;drag=null;
    try{localStorage.setItem('jigsaws-img',f)}catch(e){}
    return{img:f,pc:LV[level],pieces:null};
  },
  cell(S,i){return{}},
  tap(S,i){},
  padTap(S,d){},
  tool(S,id){
    if(id==='prev')showPrev=!showPrev;
    else if(id==='pick')openPick();
    else if(id==='outl'){outl=!outl;try{localStorage.setItem('jigsaws-outl',outl?1:0)}catch(e){}}
    else if(id==='clear'){arrange(S,true);toast('Pieces moved to the tray.')}
    else if(id==='scat'){arrange(S,false);toast('Pieces scattered.')}
  },
  won(S){return !!S.fin},
  lost(S){return false},
  statText(S){return S.pieces?S.pieces.filter(p=>p.s).length+'/'+S.pieces.length:'–'},
  hint(S){
    if(S.err)return 'Could not load any pictures.';
    if(!S.pieces)return 'Loading picture…';
    if(showPrev)return 'Tap the picture to hide the preview.';
    return (NAMES[S.img]||'')+' · '+S.X*S.Y+' pieces';
  },
  draw(cur){
    const ok=prepare();layout();render();
    if(ok&&allSolved(cur)&&!cur.fin&&!finT){   // brief pause on the finished picture, then the win dialog
      finT=setTimeout(()=>{finT=0;if(S===cur){cur.fin=1;after()}},1800);
    }
  },
  started(S){return !!S.pieces&&S.pieces.some(p=>p.s)}
};
/* ===================== ENGINE: leave as is ===================== */
const $=s=>document.querySelector(s);
const fmt=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');
let S,lv=0,secs=0,over=false,flash='',ft,sel=-1;
const base=[],cells=[],pbs=[],tbs=[],prev=[],until=[];
function pulse(id){const e=$(id);e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function toast(m){flash=m;draw();clearTimeout(ft);ft=setTimeout(()=>{flash='';draw()},3500)}
function addTime(n){secs+=n;$('#tm').textContent=fmt(secs);pulse('#tm')}

document.title=G.title;$('#sl').textContent=G.statLabel;
const board=$('#board');
if(G.rows){board.style.gridTemplateColumns='repeat('+G.cols+',1fr)';board.style.setProperty('--ar',G.cols/G.rows)}
for(let i=0;i<G.rows*G.cols;i++){
  const r=i/G.cols|0,c=i%G.cols,b=G.box;
  const cls='c'+(b&&(c+1)%b[1]==0&&c<G.cols-1?' rb':'')+(b&&(r+1)%b[0]==0&&r<G.rows-1?' bb':'')+(c==G.cols-1?' re':'')+(r==G.rows-1?' be':'');
  base.push(cls);const el=document.createElement('button');el.className=cls;
  el.setAttribute('aria-label','Row '+(r+1)+' column '+(c+1));
  el.onclick=()=>{if(over)return;sel=i;G.tap(S,i);after()};board.append(el);cells.push(el);
}
if(G.pad){const p=$('#pad');p.style.gridTemplateColumns='repeat('+G.pad.length+',1fr)';
  G.pad.forEach(d=>{const b=document.createElement('button');b.innerHTML=d+'<small></small>';b.onclick=()=>{if(!over){G.padTap(S,d);after()}};p.append(b);pbs.push(b)})}
const tl=$('#tools'),hb=$('#hb');
function closeMenu(){tl.classList.remove('open');hb.setAttribute('aria-expanded','false')}
hb.onclick=e=>{e.stopPropagation();hb.setAttribute('aria-expanded',tl.classList.toggle('open'))};
document.addEventListener('click',e=>{if(!tl.contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
G.tools.forEach(t=>{const b=document.createElement('button');b.innerHTML=ico(t.icon||IC.dot)+'<span></span>';b.onclick=()=>{closeMenu();if(!over){G.tool(S,t.id);after()}};tl.append(b);tbs.push(b)});
const nb=document.createElement('button');nb.innerHTML=ico(IC.plus)+'<span>New game</span>';nb.onclick=()=>{closeMenu();openNew()};tl.append(nb);
const hbt=document.createElement('button');hbt.innerHTML=ico(IC.help)+'<span>How to play</span>';hbt.onclick=()=>{closeMenu();openHelp()};tl.prepend(hbt);
const hw=$('#hw');$('#hc').innerHTML=G.help||'';
function openHelp(){hw.classList.add('show');try{localStorage.setItem(G.id+'-seen','1')}catch(e){}$('#hx').focus()}
function closeHelp(){hw.classList.remove('show')}
$('#hx').onclick=closeHelp;hw.onclick=e=>{if(e.target===hw)closeHelp()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHelp()});
G.levels.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>newGame(i);$('#lvls').append(b)});

function draw(){
  const now=Date.now();
  cells.forEach((el,i)=>{const r=G.cell(S,i)||{};
    const cls=base[i]+(i===sel&&G.showSel?' sel':'')+(r.c?' '+r.c:'');
    const sig=cls+'|'+(r.h!=null?r.h:r.t||'');
    el.className=cls;if(r.h!=null)el.innerHTML=r.h;else el.textContent=r.t||'';
    if(prev[i]!==undefined&&prev[i]!==sig){until[i]=now+600;void el.offsetWidth}   /* tile changed: flash it */
    if(now<(until[i]||0))el.className=cls+' flash';
    prev[i]=sig});
  pbs.forEach((b,k)=>{const d=G.pad[k];b.disabled=over||(G.padOff?G.padOff(S,d):false);b.lastChild.textContent=G.padNote?G.padNote(S,d):''});
  G.tools.forEach((t,k)=>{tbs[k].lastChild.textContent=t.label(S);tbs[k].disabled=over||(t.disabled?t.disabled(S):false);tbs[k].classList.toggle('on',!!(t.on&&t.on(S)))});
  $('#ms').textContent=G.statText(S);$('#st').textContent=flash||G.hint(S)||'';
  $('#ti').textContent=G.levels[lv];
  [...$('#lvls').children].forEach((b,i)=>b.classList.toggle('cur',i===lv));
  if(G.draw)G.draw(S);
}
function after(){draw();save();if(over)return;if(G.won(S))end(true);else if(G.lost(S))end(false)}
let fwRaf=0;
function stopFw(){cancelAnimationFrame(fwRaf);$('#fw').style.display='none'}
function fireworks(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=$('#fw'),cx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);cv.style.display='block';
  const ps=[],cols=['#ffd978','#6cc3e0','#ff7b7b','#9be3b4','#ffffff','#d9a8ff'];
  const t0=performance.now();let last=t0,next=0;
  function burst(){
    const x=innerWidth*(.15+Math.random()*.7),y=innerHeight*(.15+Math.random()*.4),col=cols[Math.random()*cols.length|0];
    for(let k=0;k<70;k++){const a=Math.random()*6.283,v=1.5+Math.random()*4;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col})}
  }
  function frame(now){
    const dt=Math.min(now-last,50)/16.7,el=now-t0;last=now;
    if(el<3500&&now>=next){burst();next=now+350+Math.random()*300}
    cx.clearRect(0,0,innerWidth,innerHeight);
    for(let i=ps.length-1;i>=0;i--){
      const p=ps[i];p.vx*=.985;p.vy=p.vy*.985+.06*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.012*dt;
      if(p.life<=0){ps.splice(i,1);continue}
      cx.globalAlpha=p.life;cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,2.2,0,6.283);cx.fill();
    }
    cx.globalAlpha=1;
    if(el<3500||ps.length)fwRaf=requestAnimationFrame(frame);else cv.style.display='none';
  }
  cancelAnimationFrame(fwRaf);fwRaf=requestAnimationFrame(frame);
}
function end(win){
  over=true;
  if(win){fireworks();let rec='';
    try{const k=G.id+'-best-'+lv,b=+localStorage.getItem(k)||0;if(!b||secs<b){localStorage.setItem(k,secs);rec=b?' New best for this level.':''}else rec=' Best: '+fmt(b)+'.'}catch(e){}
    $('#ot').textContent='Solved';$('#op').textContent='Finished '+G.levels[lv]+' in '+fmt(secs)+'.'+rec+' Pick a difficulty to play again.';
  }else{$('#ot').textContent='Round over';$('#op').textContent=((G.loseText||'')+' Pick a difficulty to try again.').trim()}
  try{localStorage.removeItem(G.id+'-game')}catch(e){}
  $('#ov').classList.remove('ask');$('#ov').classList.add('show');draw();
}
function newGame(l){
  stopFw();if(l!==undefined)lv=l;prev.length=0;until.length=0;S=G.newState(lv);secs=0;over=false;sel=-1;flash='';
  $('#ov').classList.remove('show','ask');$('#tm').textContent='0:00';draw();save();
}
function openNew(){
  const started=!over&&(G.started?G.started(S):secs>3);
  $('#ot').textContent='New game';
  $('#op').textContent=started?'Your progress on this game will be lost. Pick a difficulty to start over.':'Pick a difficulty.';
  $('#ov').classList.add('show','ask');
}
$('#oc').onclick=()=>$('#ov').classList.remove('show','ask');
function save(){try{localStorage.setItem(G.id+'-game',JSON.stringify({lv,S,secs}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(G.id+'-game'));if(s&&s.S){lv=s.lv;S=s.S;secs=s.secs;$('#tm').textContent=fmt(secs);draw();return true}}catch(e){}return false}
document.addEventListener('keydown',e=>{if(G.key&&!over&&!hw.classList.contains('show')){G.key(S,e);after()}});
setInterval(()=>{if(!over&&!document.hidden&&!hw.classList.contains('show')){secs++;$('#tm').textContent=fmt(secs);if(secs%5==0)save()}},1000);
if(!load())newGame(0);
try{if(!localStorage.getItem(G.id+'-seen'))openHelp()}catch(e){}
</script>
