<script>
/* =====================================================================
   GAME DEFINITION: the only part you edit for a new game.
   State S must be plain JSON (it is saved automatically).
   Helpers available in hooks: pulse('#ms'|'#tm'), toast(msg), addTime(sec)
   ===================================================================== */
/* CLUE BANK: one entry per line as WORD|clue. Add as many as you like (letters A-Z only, 3+ letters).
   Each puzzle picks words from this list and shows their clues under the board. */
/* Default set is defined inline above; clues.js overwrites window.CLUES_TXT with the full bank. */
const CLUES_TXT=window.CLUES_TXT;
const CL={},BANK=[];
CLUES_TXT.split('\n').forEach(l=>{const m=l.match(/^([A-Za-z ]+)\|(.+)$/);if(!m)return;const w=m[1].toUpperCase().replace(/[^A-Z]/g,'');if(w.length>=3&&!CL[w]){CL[w]=m[2].trim();BANK.push(w)}});
const K=w=>w.replace(/[^A-Z]/g,'');
const DIRS=[[0,1],[1,0]]; /* 0 = across (left to right), 1 = down (top to bottom) */
const SIZES=[8,12,16];
const rv=w=>w.split('').reverse().join('');
function attempt(n,bank,mode){
  const g=Array(n*n).fill(''),dm=Array(n*n).fill(0),words=[];let cross=0;
  /* mode 0: long words first, 1: fully shuffled, 2: short words first (all with some noise) */
  const pool=bank.filter(w=>K(w).length<=n).map(w=>[w,mode===1?Math.random():(mode===2?K(w).length:-K(w).length)+Math.random()*6]).sort((a,b)=>a[1]-b[1]).map(a=>a[0]);
  /* repeat over the unplaced words: earlier placements open up new crossing spots */
  let progress=true,pass=0;
  while(progress&&pass++<4){progress=false;
  for(const w0 of pool){const w=K(w0);
    if(words.includes(w0))continue;   /* a word is used once; words inside other words are fine */
    /* try every placement; keep the ones that cross the most existing words */
    let best=-1,cand=[];
    for(let d=0;d<DIRS.length;d++){const [dr,dc]=DIRS[d];
      for(let r=0;r+dr*(w.length-1)<n;r++)for(let c=0;c+dc*(w.length-1)<n;c++){
        let ok=true,x=0;
        /* a word must have an empty cell (or the edge) before and after it */
        const br=r-dr,bc=c-dc,ar=r+dr*w.length,ac=c+dc*w.length;
        if((br>=0&&bc>=0&&g[br*n+bc])||(ar<n&&ac<n&&g[ar*n+ac]))continue;
        for(let k=0;k<w.length&&ok;k++){const rr=r+dr*k,cc=c+dc*k,j=rr*n+cc,v=g[j];
          if(v){if(v!==w[k]||(dm[j]&(1<<d))){ok=false;break}x++;continue}
          /* a new letter may not sit beside any other letter: words only meet by crossing */
          for(const sg of [-1,1]){const nr=rr+dc*sg,nc=cc+dr*sg;
            if(nr<0||nc<0||nr>=n||nc>=n)continue;
            if(g[nr*n+nc]){ok=false;break}}
        }
        if(!ok)continue;
        if(words.length&&!x)continue;               /* must cross something */
        if(x>best){best=x;cand=[]}
        if(x===best)cand.push([d,r,c]);
      }}
    if(!cand.length)continue;
    const [d,r,c]=cand[Math.random()*cand.length|0],[dr,dc]=DIRS[d];
    for(let k=0;k<w.length;k++){const j=(r+dr*k)*n+c+dc*k;g[j]=w[k];dm[j]|=1<<d}
    cross+=Math.max(best,0);words.push(w0);progress=true;
  }}
  return{g,words,cross};
}
/* The word (run of 2+ letters) through cell i in direction d, or null */
function run(S,i,d){
  const n=S.n,[dr,dc]=DIRS[d];let r=i/n|0,c=i%n;
  if(!S.g[i])return null;
  while(r-dr>=0&&c-dc>=0&&S.g[(r-dr)*n+c-dc]){r-=dr;c-=dc}
  const s0=r*n+c;let len=1;
  while(r+dr*len<n&&c+dc*len<n&&S.g[(r+dr*len)*n+c+dc*len])len++;
  return len>1?{s:s0,len,d,n,step:dr*n+dc}:null;
}
const inRun=(R,i)=>{const k=(i-R.s)/R.step;if(!Number.isInteger(k)||k<0||k>=R.len)return false;return R.d===1?(i-R.s)%R.n===0:(i/R.n|0)===(R.s/R.n|0)};
let NC={g:null,m:null};
function nums(S){
  if(NC.g===S.g)return NC.m;
  const m={};let k=0;
  for(let i=0;i<S.g.length;i++){if(!S.g[i])continue;
    const A=run(S,i,0),D=run(S,i,1);
    if((A&&A.s===i)||(D&&D.s===i))m[i]=++k}
  NC={g:S.g,m};return m;
}
const KEYS=[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['Z','X','C','V','B','N','M','\u232B']];
function dropMark(S,i){S.ck=S.ck.filter(x=>x!==i)}
const fullRun=(S,R)=>{for(let k=0;k<R.len;k++)if(!S.u[R.s+k*R.step])return false;return true};
const okRun=(S,R)=>{for(let k=0;k<R.len;k++){const j=R.s+k*R.step;if(S.u[j]!==S.g[j])return false}return true};
/* lk = cells of correct words (locked), bd = cells of filled-but-wrong words */
function refresh(S){
  const N=S.g.length;S.lk=Array(N).fill(0);S.bd=Array(N).fill(0);
  for(let i=0;i<N;i++)for(let d=0;d<2;d++){
    const R=run(S,i,d);if(!R||R.s!==i||!fullRun(S,R))continue;
    const ok=okRun(S,R);
    for(let k=0;k<R.len;k++){const j=R.s+k*R.step;if(ok)S.lk[j]=1;else S.bd[j]=1}
  }
  for(let i=0;i<N;i++)if(S.lk[i])S.bd[i]=0;
}
function wordList(S){const L=[];for(let d=0;d<2;d++)for(let i=0;i<S.g.length;i++){const R=run(S,i,d);if(R&&R.s===i)L.push(R)}return L}
function selectWord(S,R){let t=R.s;for(let k=0;k<R.len;k++){const j=R.s+k*R.step;if(!S.u[j]){t=j;break}}S.sel=t;S.dir=R.d}
/* jump to the next word (across clues, then down clues) that still has an empty box */
function nextWord(S){
  const L=wordList(S),cur=S.sel>=0?run(S,S.sel,S.dir):null;
  const k=cur?L.findIndex(R=>R.s===cur.s&&R.d===cur.d):-1;
  for(let j=1;j<=L.length;j++){const R=L[(k+j+L.length)%L.length];
    if(cur&&R.s===cur.s&&R.d===cur.d)continue;
    if(!fullRun(S,R)){selectWord(S,R);return true}}
  return false;
}
/* jump back to the last editable box of the previous word */
function prevWord(S){
  const L=wordList(S),cur=run(S,S.sel,S.dir);
  const k=cur?L.findIndex(R=>R.s===cur.s&&R.d===cur.d):0;
  for(let j=1;j<L.length;j++){const R=L[(k-j+L.length*2)%L.length];
    for(let q=R.len-1;q>=0;q--){const c=R.s+q*R.step;if(!S.lk[c]){S.sel=c;S.dir=R.d;return true}}}
  return false;
}
function afterEntry(S,R,wasFull){
  /* finished a word (just filled it, or fixed it): move on to the next one */
  if(R&&fullRun(S,R)&&(!wasFull||okRun(S,R))&&nextWord(S))return;
  if(!R)return;
  let nx=S.sel+R.step;while(inRun(R,nx)&&S.lk[nx])nx+=R.step;
  if(inRun(R,nx)){S.sel=nx;return}
  for(let k=0;k<R.len;k++){const j=R.s+k*R.step;if(!S.u[j]){S.sel=j;return}}
}
function typeLetter(S,ch){
  if(S.sel<0||S.lk[S.sel])return;
  const R=run(S,S.sel,S.dir),wasFull=!!R&&fullRun(S,R);
  S.u[S.sel]=ch;dropMark(S,S.sel);refresh(S);
  afterEntry(S,R,wasFull);
}
function backspace(S){
  if(S.sel<0)return;
  if(S.u[S.sel]&&!S.lk[S.sel]){S.u[S.sel]='';dropMark(S,S.sel);refresh(S);return}
  const R=run(S,S.sel,S.dir);if(!R)return;
  let pv=S.sel-R.step;while(inRun(R,pv)&&S.lk[pv])pv-=R.step;
  if(inRun(R,pv)){S.sel=pv;S.u[pv]='';dropMark(S,pv);refresh(S)}
  else prevWord(S);
}
function moveSel(S,dr,dc){
  if(S.sel<0)return;const n=S.n,r=(S.sel/n|0)+dr,c=S.sel%n+dc;
  if(r<0||c<0||r>=n||c>=n||!S.g[r*n+c])return;
  S.sel=r*n+c;const d=dr?1:0;if(run(S,S.sel,d))S.dir=d;else if(!run(S,S.sel,S.dir))S.dir=1-S.dir;
}
const G={
  id:'crossword1',
  title:'Crossword',
  levels:['8x8','12x12','16x16'],
  rows:8, cols:8,
  box:null,
  statLabel:'Filled',
  pad:null,
  keys:KEYS,
  tools:[
    {id:'check',icon:'<path d="M5 12l5 5L20 7"/>',label:S=>'Check letters',disabled:S=>S.u.every(x=>!x)},
    {id:'reveal',icon:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',label:S=>'Reveal letter (+10s)',disabled:S=>S.sel<0||!!S.lk[S.sel]||S.u[S.sel]===S.g[S.sel]}
  ],
  help:'<p>Fill in the crossword. The clue for the selected word is shown under the board.</p><ul><li>Tap a box to select it. Type with the keyboard. Tap the selected box again to switch between across and down.</li><li>Small numbers on the board mark where words start. The number in brackets is the word\'s length.</li><li>When you finish a word you jump to the next one.</li><li>Correct words turn green and lock. A filled word that is wrong turns red.</li><li><b>Check letters</b> in the menu marks wrong letters in red even in unfinished words.</li><li><b>Reveal letter</b> fills in the selected box, but adds 10 seconds.</li></ul>',
  newState(level){
    const n=SIZES[level];let best=null;
    /* keep generating for a short time budget and take the fullest grid */
    const t0=performance.now();
    for(let i=0;i<3||performance.now()-t0<600;i++){const r=attempt(n,BANK,i%3);if(!best||r.words.length+r.cross>best.words.length+best.cross)best=r}
    const cl={};best.words.forEach(w=>cl[w]=CL[w]);
    const st={n,dirs:6,g:best.g,words:best.words.sort(),cl,u:Array(n*n).fill(''),ck:[],sel:-1,dir:0};
    refresh(st);
    /* start on the first word */
    const L=wordList(st).sort((x,y)=>x.s-y.s||x.d-y.d);if(L.length)selectWord(st,L[0]);
    return st;
  },
  cell(S,i){
    if(!S.g[i])return{t:'',c:'x',k:'',off:1};
    let c='l';
    const R=S.sel>=0?run(S,S.sel,S.dir):null;
    if(i===S.sel)c+=' sel';else if(R&&inRun(R,i))c+=' p';
    if(S.lk[i])c+=' lk';else if(S.bd[i]||S.ck.includes(i))c+=' bad';
    const nm=nums(S)[i];
    return{h:(nm?'<span class="n">'+nm+'</span>':'')+(S.u[i]||''),c,k:''};
  },
  valid(S){
    if(!(S.dirs===6&&S.cl&&typeof S.cl==='object'&&Array.isArray(S.u)&&Array.isArray(S.ck)&&S.u.length===S.g.length&&S.g.length===S.n*S.n))return false;
    refresh(S);return true;
  },
  tap(S,i){
    if(!S.g[i])return;
    const hasA=!!run(S,i,0),hasD=!!run(S,i,1);
    if(i===S.sel){if(hasA&&hasD)S.dir=1-S.dir;return}
    S.sel=i;if(!(S.dir===0?hasA:hasD))S.dir=1-S.dir;
  },
  padTap(S,k){if(k==='\u232B')backspace(S);else typeLetter(S,k)},
  key(S,e){
    if(e.ctrlKey||e.metaKey||e.altKey||S.sel<0)return;
    if(/^[a-zA-Z]$/.test(e.key)){typeLetter(S,e.key.toUpperCase());e.preventDefault()}
    else if(e.key==='Backspace'||e.key==='Delete'){backspace(S);e.preventDefault()}
    else if(e.key==='ArrowRight'){moveSel(S,0,1);e.preventDefault()}
    else if(e.key==='ArrowLeft'){moveSel(S,0,-1);e.preventDefault()}
    else if(e.key==='ArrowDown'){moveSel(S,1,0);e.preventDefault()}
    else if(e.key==='ArrowUp'){moveSel(S,-1,0);e.preventDefault()}
    else if(e.key===' '){if(run(S,S.sel,0)&&run(S,S.sel,1))S.dir=1-S.dir;e.preventDefault()}
  },
  tool(S,id){
    if(id==='check'){S.ck=S.g.map((x,i)=>x&&S.u[i]&&S.u[i]!==x?i:-1).filter(i=>i>=0);if(!S.ck.length)toast('No wrong letters so far.');return}
    if(id==='reveal'&&S.sel>=0&&!S.lk[S.sel]){const R=run(S,S.sel,S.dir),wasFull=!!R&&fullRun(S,R);S.u[S.sel]=S.g[S.sel];dropMark(S,S.sel);refresh(S);addTime(10);afterEntry(S,R,wasFull)}
  },
  won(S){return S.g.every((x,i)=>!x||S.u[i]===x)},
  lost(S){return false},
  statText(S){return S.u.filter(Boolean).length+'/'+S.g.filter(Boolean).length},
  hint(S,msg){
    const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    if(msg)return '<div class="cur">'+esc(msg)+'</div>';
    const R=S.sel>=0?run(S,S.sel,S.dir):null;
    if(!R)return '<div class="cur">Tap a box to start</div>';
    let w='';for(let k=0;k<R.len;k++)w+=S.g[R.s+k*R.step];
    return '<div class="cur"><b>'+nums(S)[R.s]+' '+(R.d?'Down':'Across')+'</b> '+esc(S.cl[w]||'')+' ('+R.len+')</div>';
  },
  started(S){return S.u.some(Boolean)},
  kb(S){return true},
};
/* ===================== ENGINE: leave as is ===================== */
const $=s=>document.querySelector(s);
const fmt=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');
let S,lv=0,secs=0,over=false,flash='',ft,sel=-1;
const base=[],cells=[],pbs=[],tbs=[],prev=[],until=[];
function pulse(id){const e=$(id);e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function toast(m){flash=m;draw();clearTimeout(ft);ft=setTimeout(()=>{flash='';draw()},3500)}
function addTime(n){secs+=n;$('#tm').textContent=fmt(secs);pulse('#tm')}

document.title=G.title;$('#sl').textContent=G.statLabel;
const board=$('#board');
function build(n){
  board.innerHTML='';cells.length=0;base.length=0;prev.length=0;until.length=0;
  board.style.gridTemplateColumns='repeat('+n+',minmax(0,1fr))';board.style.gridTemplateRows='repeat('+n+',minmax(0,1fr))';board.style.setProperty('--n',n);
  for(let i=0;i<n*n;i++){
    const r=i/n|0,c=i%n,cls='c'+(c==n-1?' re':'')+(r==n-1?' be':'');
    base.push(cls);const el=document.createElement('button');el.className=cls;el.dataset.i=i;
    el.setAttribute('aria-label','Row '+(r+1)+' column '+(c+1));
    el.onclick=()=>{if(!over){G.tap(S,i);after()}};board.append(el);cells.push(el);
  }
}
if(G.pad){const p=$('#pad');p.style.gridTemplateColumns='repeat('+G.pad.length+',1fr)';
  G.pad.forEach(d=>{const b=document.createElement('button');b.innerHTML=d+'<small></small>';b.onclick=()=>{if(!over){G.padTap(S,d);after()}};p.append(b);pbs.push(b)})}
const kbEl=$('#kb');
if(!G.pad)$('#pad').style.display='none';
(G.keys||[]).forEach(row=>{const d=document.createElement('div');d.className='kr';
  if(row.includes('\u232B')){const sp=document.createElement('span');sp.className='sp';d.append(sp)}
  row.forEach(k=>{const b=document.createElement('button');
    if(k==='\u232B'){const md=document.createElement('span');md.className='mid';d.append(md);b.className='w';b.setAttribute('aria-label','Delete');b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM17 9.5l-5 5M12 9.5l5 5"/></svg>'}
    else b.textContent=k;
    b.onclick=()=>{if(!over){G.padTap(S,k);after()}};d.append(b)});kbEl.append(d)});
const svgi=p=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
const tl=$('#tools'),hb=$('#hb');
function closeMenu(){tl.classList.remove('open');hb.setAttribute('aria-expanded','false')}
hb.onclick=e=>{e.stopPropagation();hb.setAttribute('aria-expanded',tl.classList.toggle('open'))};
document.addEventListener('click',e=>{if(!tl.contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
G.tools.forEach(t=>{const b=document.createElement('button');b.onclick=()=>{closeMenu();if(!over){G.tool(S,t.id);after()}};tl.append(b);tbs.push(b)});
const nb=document.createElement('button');nb.innerHTML=svgi('<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>')+'New game';nb.onclick=()=>{closeMenu();openNew()};tl.append(nb);
const hbt=document.createElement('button');hbt.innerHTML=svgi('<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4.2"/><path d="M12 17.5h.01"/>')+'How to play';hbt.onclick=()=>{closeMenu();openHelp()};tl.prepend(hbt);
const hw=$('#hw');$('#hc').innerHTML=G.help||'';
function openHelp(){hw.classList.add('show');try{localStorage.setItem(G.id+'-seen','1')}catch(e){}$('#hx').focus()}
function closeHelp(){hw.classList.remove('show')}
$('#hx').onclick=closeHelp;hw.onclick=e=>{if(e.target===hw)closeHelp()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHelp()});
G.levels.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>newGame(i);$('#lvls').append(b)});

function draw(){
  const now=Date.now();
  cells.forEach((el,i)=>{const r=G.cell(S,i)||{};
    const cls=base[i]+(i===sel&&G.showSel?' sel':'')+(r.c?' '+r.c:'');
    const sig=(r.k!=null?r.k:(r.c||'').replace('pv','').trim())+'|'+(r.h!=null?r.h:r.t||'');
    el.className=cls;el.disabled=!!r.off;if(r.h!=null)el.innerHTML=r.h;else el.textContent=r.t||'';
    if(prev[i]!==undefined&&prev[i]!==sig){until[i]=now+600;void el.offsetWidth}   /* tile changed: flash it */
    if(now<(until[i]||0))el.className=cls+' flash';
    prev[i]=sig});
  kbEl.classList.toggle('show',!!(G.kb&&G.kb(S))&&!over);
  pbs.forEach((b,k)=>{const d=G.pad[k];b.disabled=over||(G.padOff?G.padOff(S,d):false);b.lastChild.textContent=G.padNote?G.padNote(S,d):''});
  G.tools.forEach((t,k)=>{tbs[k].innerHTML=(t.icon?svgi(t.icon):'')+t.label(S);tbs[k].disabled=over||(t.disabled?t.disabled(S):false);tbs[k].classList.toggle('on',!!(t.on&&t.on(S)))});
  $('#ms').textContent=G.statText(S);setSt();
  $('#ti').textContent=G.levels[lv];
  [...$('#lvls').children].forEach((b,i)=>b.classList.toggle('cur',i===lv));if(G.overlay)G.overlay(S);syncDock();keepSelVisible();
}
const dockEl=$('#dock');
const topEl=$('#top');
function syncDock(){const st=document.documentElement.style;st.setProperty('--dock',dockEl.offsetHeight+'px');st.setProperty('--head',topEl.offsetHeight+'px')}
if(window.ResizeObserver){const ro=new ResizeObserver(syncDock);ro.observe(dockEl);ro.observe(topEl)}addEventListener('resize',syncDock);syncDock();
let lastSel=-2;
function keepSelVisible(){
  if(typeof S.sel!=='number'||S.sel<0)return;
  const el=cells[S.sel];if(!el)return;
  const free=!over&&!hw.classList.contains('show')&&!$('#ov').classList.contains('show')&&!tl.classList.contains('open');
  if(free&&document.activeElement!==el)el.focus({preventScroll:true});
  if(S.sel===lastSel)return;lastSel=S.sel;
  el.scrollIntoView({block:'nearest',inline:'nearest'});
}
function setSt(){$('#st').innerHTML=G.hint(S,flash)||''}
function after(){draw();save();if(over)return;if(G.won(S))end(true);else if(G.lost(S))end(false)}
let fwRaf=0;
function stopFw(){cancelAnimationFrame(fwRaf);$('#fw').style.display='none'}
function fireworks(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=$('#fw'),cx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);cv.style.display='block';
  const ps=[],cols=['#ffd978','#6cc3e0','#ff7b7b','#9be3b4','#ffffff','#d9a8ff'];
  const t0=performance.now();let last=t0,next=0;
  function burst(){
    const x=innerWidth*(.15+Math.random()*.7),y=innerHeight*(.15+Math.random()*.4),col=cols[Math.random()*cols.length|0];
    for(let k=0;k<70;k++){const a=Math.random()*6.283,v=1.5+Math.random()*4;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col})}
  }
  function frame(now){
    const dt=Math.min(now-last,50)/16.7,el=now-t0;last=now;
    if(el<3500&&now>=next){burst();next=now+350+Math.random()*300}
    cx.clearRect(0,0,innerWidth,innerHeight);
    for(let i=ps.length-1;i>=0;i--){
      const p=ps[i];p.vx*=.985;p.vy=p.vy*.985+.06*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.012*dt;
      if(p.life<=0){ps.splice(i,1);continue}
      cx.globalAlpha=p.life;cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,2.2,0,6.283);cx.fill();
    }
    cx.globalAlpha=1;
    if(el<3500||ps.length)fwRaf=requestAnimationFrame(frame);else cv.style.display='none';
  }
  cancelAnimationFrame(fwRaf);fwRaf=requestAnimationFrame(frame);
}
let endT=0;
function end(win){
  over=true;let ot,op;
  if(win){fireworks();let rec='';
    try{const k=G.id+'-best-'+lv,b=+localStorage.getItem(k)||0;if(!b||secs<b){localStorage.setItem(k,secs);rec=b?' New best for this level.':''}else rec=' Best: '+fmt(b)+'.'}catch(e){}
    ot='Solved';op='Finished '+G.levels[lv]+' in '+fmt(secs)+'.'+rec+' Pick a size to play again.';
  }else{ot='Round over';op=((G.loseText||'')+' Pick a size to try again.').trim()}
  try{localStorage.removeItem(G.id+'-game')}catch(e){}
  draw();clearTimeout(endT);
  /* pause a moment so the finished board can be seen before the dialog */
  endT=setTimeout(()=>{if(!over)return;$('#ot').textContent=ot;$('#op').textContent=op;$('#ov').classList.remove('ask');$('#ov').classList.add('show')},win?1000:0);
}
function newGame(l){lastSel=-2;
  clearTimeout(endT);stopFw();if(l!==undefined)lv=l;prev.length=0;until.length=0;S=G.newState(lv);build(S.n);secs=0;over=false;sel=-1;flash='';
  $('#ov').classList.remove('show','ask');$('#tm').textContent='0:00';draw();save();
}
function openNew(){
  const started=!over&&(G.started?G.started(S):secs>3);
  $('#ot').textContent='New game';
  $('#op').textContent=started?'Your progress on this game will be lost. Pick a size to start over.':'Pick a size.';
  $('#ov').classList.add('show','ask');
}
$('#oc').onclick=()=>$('#ov').classList.remove('show','ask');
function save(){try{localStorage.setItem(G.id+'-game',JSON.stringify({lv,S,secs}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(G.id+'-game'));if(s&&s.S&&(!G.valid||G.valid(s.S))){lv=s.lv;S=s.S;secs=s.secs;build(S.n);$('#tm').textContent=fmt(secs);draw();return true}}catch(e){}return false}
document.addEventListener('keydown',e=>{if(G.key&&!over&&!hw.classList.contains('show')&&!$('#ov').classList.contains('show')){G.key(S,e);after()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('c'))e.preventDefault()});
document.addEventListener('keyup',e=>{if(e.key===' '&&e.target.classList&&e.target.classList.contains('c'))e.preventDefault()});
setInterval(()=>{if(!over&&!document.hidden&&!hw.classList.contains('show')){secs++;$('#tm').textContent=fmt(secs);if(secs%5==0)save()}},1000);
if(!load())newGame(0);
try{if(!localStorage.getItem(G.id+'-seen'))openHelp()}catch(e){}
</script>
