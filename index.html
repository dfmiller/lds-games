<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover">
	<title>Latter-day Saint Games</title>
	<link rel="stylesheet" type="text/css" href="./global.css">
	<style>

		html,
		body {
			width: 100%;
			height: auto;
			min-height: 100vh;
			overflow-x: hidden;
			overflow-y: auto;
			background: #f3f4f6;
		}

		@supports (height: 100dvh) {
			body {
				min-height: 100dvh;
			}
		}

		.game-books {
			display: flex;
			flex-direction: column;
			flex-wrap: nowrap;
			position: relative;
			z-index: 1;
			box-sizing: border-box;
			width: 100%;
			min-height: 100vh;
			height: auto;
			padding: clamp(1.5rem, 4vw, 3rem) clamp(1rem, 4vw, 3rem);
			background:
				linear-gradient(rgba(243, 244, 246, .78), rgba(243, 244, 246, .78)),
				url(./temples/nZe5RQmY_o.jpg) center / cover fixed;
		}

		.home-title {
			position: relative;
			z-index: 1;
			flex: none;
			margin: 0;
			color: #202938;
			font-size: clamp(2rem, 4vw, 3rem);
			letter-spacing: -.04em;
		}

		.home-subtitle {
			margin: .35rem 0 1.75rem;
			color: #687386;
			font-size: 1rem;
		}

		.game-card-grid {
			position: relative;
			z-index: 1;
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(min(100%, 8rem), 1fr));
			gap: clamp(.75rem, 2vw, 1.5rem);
		}

		@media (min-width: 700px) {
			.game-card-grid {
				grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr));
			}
		}

		.game-card-grid a {
			display: flex;
			flex-direction: column;
			align-items: stretch;
			justify-content: flex-end;
			box-sizing: border-box;
			min-width: 0;
			aspect-ratio: 3 / 4;
			padding: clamp(1rem, 2vw, 1.5rem);
			text-decoration: none;
			color: white;
			text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
			position: relative;
			isolation: isolate;
			overflow: hidden;
			border-radius: 1rem;
			background: #263243;
			box-shadow: 0 8px 20px rgba(31, 41, 55, .16);
			transition: transform .18s ease, box-shadow .18s ease;
		}

		.game-card-grid a:hover {
			transform: translateY(-3px);
			box-shadow: 0 14px 28px rgba(31, 41, 55, .22);
		}

		.game-card-grid a:focus-visible {
			outline: 3px solid #5865d8;
			outline-offset: 3px;
		}

		.game-card-grid a::after {
			content: '';
			position: absolute;
			inset: 0;
			z-index: -1;
			background: linear-gradient(180deg, rgba(12, 18, 30, .42) 0%, rgba(12, 18, 30, .72) 55%, rgba(12, 18, 30, .94) 100%);
		}

		.game-card-grid a img {
			position: absolute;
			inset: 0;
			z-index: -2;
			width: 100%;
			height: 100%;
			max-width: none;
			max-height: none;
			object-fit: cover;
			transition: transform .25s ease;
		}

		.game-card-grid a:hover img {
			transform: scale(1.04);
		}

		.game-card-grid a strong {
			font-size: clamp(1.1rem, 1.8vw, 1.5rem);
			line-height: 1.15;
		}

		.game-card-description {
			margin-top: .4rem;
			font-size: .9rem;
			line-height: 1.4;
			color: rgba(255, 255, 255, .88);
		}

		.home-footer {
			display: flex;
			flex-wrap: wrap;
			justify-content: space-between;
			gap: .5rem 1.5rem;
			margin-top: 2rem;
			padding-top: 1rem;
			border-top: 1px solid rgba(32, 41, 56, .2);
			color: #4b5563;
			font-size: .85rem;
		}

		.home-footer a {
			color: #3949ab;
		}

		@media (prefers-reduced-motion: reduce) {
			.game-card-grid a,
			.game-card-grid a img {
				transition: none;
			}
		}

		.game-frame {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			z-index: 3;
			display: flex;
			flex-direction: column;
			width: min(100vw, calc(100vh * 4 / 7));
			height: min(100vh, calc(100vw * 7 / 4));
			background: #eee;
		}

		@supports (height: 100dvh) {
			.game-frame {
				width: min(100vw, calc(100dvh * 4 / 7));
				height: min(100dvh, calc(100vw * 7 / 4));
			}
		}

		@media (max-width: 700px) {
			.game-frame {
				top: 0;
				left: 0;
				right: auto;
				bottom: auto;
				width: 100vw;
				height: 100vh;
				box-sizing: border-box;
				transform: none;
				padding:
					env(safe-area-inset-top)
					env(safe-area-inset-right)
					env(safe-area-inset-bottom)
					env(safe-area-inset-left);
			}
		}

		html.game-open,
		html.game-open body {
			overflow: hidden;
		}

		body.game-open {
			position: fixed;
			top: var(--game-scroll-offset);
			width: 100%;
		}

		@supports (height: 100dvh) {
			@media (max-width: 700px) {
				.game-frame {
					height: 100dvh;
				}
			}
		}

		.game-backdrop {
			position: fixed;
			inset: 0;
			z-index: 2;
			background: rgba(0, 0, 0, .58);
		}

		.game-backdrop[hidden] {
			display: none;
		}

		.game-frame[hidden] {
			display: none;
		}

		.game-frame header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex: none;
			min-height: 2.5rem;
			padding: 0 .75rem;
			box-sizing: border-box;
			background: #333;
			color: white;
			font-size: .9rem;
		}

		.game-frame button {
			padding: .15rem .5rem;
			border: 0;
			background: transparent;
			color: inherit;
			font-size: 1.5rem;
			line-height: 1;
			cursor: pointer;
		}

		.game-frame iframe {
			flex: 1;
			width: 100%;
			min-height: 0;
			border: 0;
			background: white;
		}

	</style>
</head>
<body>
	<main class="layout-full game-books">
		<h1 class="home-title">LDS Games</h1>
		<p class="home-subtitle">Games and puzzles</p>
		<div class="game-card-grid"></div>
		<footer class="home-footer">
			<span>Send feedback to <a href="mailto:digitalfunmedia@gmail.com?subject=LDS%20Games">digitalfunmedia@gmail.com</a></span>
			<span>Temple images provided by <a href="https://www.etsy.com/shop/BringTheTempleHome" target="_blank" rel="noopener noreferrer">Bring The Temple Home</a></span>
		</footer>

		<div class="game-backdrop" hidden></div>
		<section class="game-frame" aria-label="Game" hidden>
			<header>
				<strong class="game-frame-title"></strong>
				<button class="game-frame-close" type="button" aria-label="Close game">&times;</button>
			</header>
			<iframe title="Game content"></iframe>
		</section>
	</main>

	<script>

        window.oncontextmenu = function() { return false }

		const gameFrame = document.querySelector('.game-frame')
		const gameBackdrop = document.querySelector('.game-backdrop')
		const gameFrameTitle = document.querySelector('.game-frame-title')
		const gameFrameContent = document.querySelector('.game-frame iframe')
		let activeGameLink
		let pageScrollY = 0

		const games = [
			{
				title: 'Word Search',
				href: './wordSearch/index.html',
				image: './wordSearch/icon.png',
				description: 'Find hidden words in themed puzzles'
			},
			{
				title: 'Pioneer Quest',
				href: './quest/index.html',
				image: './quest/quest.jpg',
				description: 'Test your trivia as a pioneer'
			},
			{
				title: 'Photo Puzzles',
				href: './photoPuzzle/index.html',
				image: './photoPuzzle/icon.png',
				description: 'Rebuild photos one piece at a time'
			},
			{
				title: 'Gospel Crossword',
				href: './crossword/crossword.html',
				image: './crossword/crossword.jpg',
				description: 'Test your knowledge with crosswords'
			},
			{
				title: 'Letter Scramble',
				href: './scramble/letter-scramble.html',
				image: './scramble/letter-scramble.jpg',
				description: 'Unscramble words and phrases'
			},
			{
				title: 'Scripture Books',
				href: './scriptureBooks/standard_works.html',
				image: './scriptureBooks/books.png',
				description: 'Learn the books of scripture'
			},
			{
				title: 'Jigsaws',
				href: './jigsaws/jigsaws.html',
				image: './jigsaws/jigsaws.png',
				description: 'Piece together temple scenes'
			}
		]

		const gameCardGrid = document.querySelector('.game-card-grid')
		games.forEach(function(game) {
			const link = document.createElement('a')
			link.href = game.href
			link.dataset.title = game.title

			const image = document.createElement('img')
			image.src = game.image
			image.alt = ''

			const title = document.createElement('strong')
			title.textContent = game.title

			const description = document.createElement('span')
			description.className = 'game-card-description'
			description.textContent = game.description

			link.append(image, title, description)
			gameCardGrid.append(link)
		})

		document.querySelector('.game-books').addEventListener('click', function(event) {
			const link = event.target.closest('a[data-title]')
			if (!link) return

			event.preventDefault()
			activeGameLink = link
			pageScrollY = window.scrollY
			gameFrameTitle.textContent = link.dataset.title
			gameFrameContent.src = link.href
			gameFrameContent.title = link.dataset.title
			gameBackdrop.hidden = false
			gameFrame.hidden = false
			document.body.style.setProperty('--game-scroll-offset', '-' + pageScrollY + 'px')
			document.body.classList.add('game-open')
			document.documentElement.classList.add('game-open')
		})

		document.querySelector('.game-frame-close').addEventListener('click', function() {
			gameFrame.hidden = true
			gameBackdrop.hidden = true
			gameFrameContent.src = 'about:blank'
			document.body.classList.remove('game-open')
			document.body.style.removeProperty('--game-scroll-offset')
			document.documentElement.classList.remove('game-open')
			window.scrollTo(0, pageScrollY)
			if (activeGameLink) activeGameLink.focus({preventScroll: true})
		})

	</script>

</body>
</html>
