<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/favicon-32.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="LDS Games">
  <meta name="apple-mobile-web-app-capable" content="yes">
	<title>Latter-day Saint Games</title>
	<link rel="stylesheet" type="text/css" href="./global.css">
	<script defer src="../vercel-analytics.js"></script>
	<style>

		html,
		body {
			width: 100%;
			height: auto;
			min-height: 100vh;
			overflow-x: hidden;
			overflow-y: auto;
			background: #f3f4f6;
		}

		@supports (height: 100dvh) {
			body {
				min-height: 100dvh;
			}
		}

		.game-books {
			display: flex;
			flex-direction: column;
			flex-wrap: nowrap;
			position: relative;
			z-index: 1;
			box-sizing: border-box;
			width: 100%;
			min-height: 100vh;
			height: auto;
			padding: clamp(.75rem, 2vw, 1.5rem) clamp(.5rem, 2vw, 1.5rem);
			background:
				linear-gradient(rgba(243, 244, 246, .78), rgba(243, 244, 246, .78)),
				url(./temples/nZe5RQmY_o.jpg) center / cover fixed;
		}

		/* ---------- Hero carousel ---------- */

		.hero {
			position: relative;
			z-index: 1;
			flex: none;
			margin-bottom: clamp(1.75rem, 4vw, 3rem);
			border-radius: 1.25rem;
			overflow: hidden;
			background: #263243;
			box-shadow: 0 14px 34px rgba(31, 41, 55, .24);
		}

		.hero-track {
			display: flex;
			overflow-x: auto;
			overflow-y: hidden;
			scroll-snap-type: x mandatory;
			scroll-behavior: smooth;
			scrollbar-width: none;
			-webkit-overflow-scrolling: touch;
			overscroll-behavior-x: contain;
		}

		.hero-track::-webkit-scrollbar {
			display: none;
		}

		.hero-slide {
			position: relative;
			isolation: isolate;
			flex: 0 0 100%;
			box-sizing: border-box;
			display: flex;
			flex-direction: column-reverse;
			justify-content: flex-end;
			align-items: flex-start;
			gap: 1.25rem;
			min-height: clamp(22rem, 52vw, 29rem);
			padding: clamp(1.25rem, 4vw, 3.5rem) clamp(1.25rem, 4vw, 3.5rem) 3.75rem;
			scroll-snap-align: start;
			scroll-snap-stop: always;
			color: white;
			text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
		}

		.hero-bg {
			position: absolute;
			inset: -2rem;
			z-index: -2;
			width: calc(100% + 4rem);
			height: calc(100% + 4rem);
			max-width: none;
			max-height: none;
			object-fit: cover;
			filter: blur(22px) saturate(1.1);
		}

		.hero-slide::before {
			content: '';
			position: absolute;
			inset: 0;
			z-index: -1;
			background: linear-gradient(90deg, rgba(12, 18, 30, .86) 0%, rgba(12, 18, 30, .62) 55%, rgba(12, 18, 30, .4) 100%);
		}

		.hero-copy {
			max-width: 34rem;
		}

		.hero-eyebrow {
			display: inline-block;
			margin-bottom: .6rem;
			font-size: .75rem;
			font-weight: 700;
			letter-spacing: .12em;
			text-transform: uppercase;
			color: rgba(255, 255, 255, .78);
		}

		.hero-heading {
			margin: 0;
			font-size: clamp(1.9rem, 4.6vw, 3.25rem);
			line-height: 1.05;
			letter-spacing: -.035em;
		}

		.hero-description {
			margin: .75rem 0 1.4rem;
			font-size: clamp(1rem, 1.6vw, 1.2rem);
			line-height: 1.45;
			color: rgba(255, 255, 255, .9);
		}

		.hero-play {
			display: inline-flex;
			align-items: center;
			gap: .5rem;
			padding: .75rem 1.5rem;
			border-radius: 999px;
			background: white;
			color: #202938;
			font-weight: 700;
			font-size: 1rem;
			text-decoration: none;
			text-shadow: none;
			box-shadow: 0 6px 16px rgba(0, 0, 0, .3);
			transition: transform .15s ease, box-shadow .15s ease;
		}

		.hero-play:hover {
			transform: translateY(-2px);
			box-shadow: 0 10px 22px rgba(0, 0, 0, .35);
		}

		.hero-play:focus-visible,
		.hero-arrow:focus-visible,
		.hero-dot:focus-visible {
			outline: 3px solid #ffffff;
			outline-offset: 3px;
		}

		.hero-art {
			flex: none;
			box-sizing: border-box;
			width: clamp(6.5rem, 22vw, 18rem);
			aspect-ratio: 1;
			border-radius: 1rem;
			overflow: hidden;
			background: #1c2433;
			box-shadow: 0 14px 34px rgba(0, 0, 0, .45);
			border: 3px solid rgba(255, 255, 255, .85);
		}

		.hero-art img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		@media (min-width: 700px) {
			.hero-slide {
				flex-direction: row;
				justify-content: space-between;
				align-items: center;
				padding-bottom: 4rem;
				padding-left: clamp(4rem, 7vw, 6rem);
				padding-right: clamp(4rem, 7vw, 6rem);
			}
		}

		.hero-arrow {
			position: absolute;
			top: 50%;
			z-index: 2;
			display: none;
			align-items: center;
			justify-content: center;
			width: 2.75rem;
			height: 2.75rem;
			margin-top: -1.375rem;
			padding: 0;
			border: 0;
			border-radius: 50%;
			background: rgba(255, 255, 255, .18);
			-webkit-backdrop-filter: blur(6px);
			backdrop-filter: blur(6px);
			color: white;
			font-size: 1.6rem;
			line-height: 1;
			cursor: pointer;
			transition: background .15s ease;
		}

		.hero-arrow:hover {
			background: rgba(255, 255, 255, .34);
		}

		.hero-arrow.prev { left: 1rem; }
		.hero-arrow.next { right: 1rem; }

		@media (min-width: 700px) {
			.hero-arrow {
				display: flex;
			}
		}

		.hero-dots {
			position: absolute;
			left: 0;
			right: 0;
			bottom: 1.1rem;
			z-index: 2;
			display: flex;
			justify-content: center;
			gap: .25rem;
		}

		.hero-dot {
			position: relative;
			width: 1.5rem;
			height: 1.5rem;
			padding: 0;
			border: 0;
			background: transparent;
			cursor: pointer;
		}

		.hero-dot::after {
			content: '';
			position: absolute;
			top: 50%;
			left: 50%;
			width: .6rem;
			height: .6rem;
			margin: -.3rem 0 0 -.3rem;
			border-radius: 999px;
			background: rgba(255, 255, 255, .5);
			transition: width .25s ease, margin .25s ease, background .25s ease;
		}

		.hero-dot[aria-current="true"]::after {
			width: 1.4rem;
			margin-left: -.7rem;
			background: white;
		}

		.section-title {
			position: relative;
			z-index: 1;
			margin: 0 0 1rem;
			color: #202938;
			font-size: 1.25rem;
			letter-spacing: -.02em;
		}

		/* ---------- Game grid ---------- */

		.game-card-grid {
			position: relative;
			z-index: 1;
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(min(100%, 8rem), 1fr));
			gap: clamp(.75rem, 2vw, 1.5rem);
		}

		@media (min-width: 700px) {
			.game-card-grid {
				grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr));
			}
		}

		.game-card-grid a {
			display: flex;
			flex-direction: column;
			align-items: stretch;
			justify-content: flex-end;
			box-sizing: border-box;
			min-width: 0;
			aspect-ratio: 3 / 4;
			padding: clamp(1rem, 2vw, 1.5rem);
			text-decoration: none;
			color: white;
			text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
			position: relative;
			isolation: isolate;
			overflow: hidden;
			border-radius: 1rem;
			background: #263243;
			box-shadow: 0 8px 20px rgba(31, 41, 55, .16);
			transition: transform .18s ease, box-shadow .18s ease;
		}

		.game-card-grid a:hover {
			transform: translateY(-3px);
			box-shadow: 0 14px 28px rgba(31, 41, 55, .22);
		}

		.game-card-grid a:focus-visible {
			outline: 3px solid #5865d8;
			outline-offset: 3px;
		}

		.game-card-grid a::after {
			content: '';
			position: absolute;
			inset: 0;
			z-index: -1;
			background: linear-gradient(180deg, rgba(12, 18, 30, .42) 0%, rgba(12, 18, 30, .72) 55%, rgba(12, 18, 30, .94) 100%);
		}

		.game-card-grid a img {
			position: absolute;
			inset: 0;
			z-index: -2;
			width: 100%;
			height: 100%;
			max-width: none;
			max-height: none;
			object-fit: cover;
			transition: transform .25s ease;
		}

		.game-card-grid a:hover img {
			transform: scale(1.04);
		}

		.game-card-grid a strong {
			font-size: clamp(1.1rem, 1.8vw, 1.5rem);
			line-height: 1.15;
		}

		.game-card-description {
			margin-top: .4rem;
			font-size: .9rem;
			line-height: 1.4;
			color: rgba(255, 255, 255, .88);
		}

		.home-footer {
			display: flex;
			flex-wrap: wrap;
			justify-content: space-between;
			gap: .5rem 1.5rem;
			margin-top: 2rem;
			padding-top: 1rem;
			border-top: 1px solid rgba(32, 41, 56, .2);
			color: #4b5563;
			font-size: .85rem;
		}

		.home-footer a {
			color: #3949ab;
		}

		@media (prefers-reduced-motion: reduce) {
			.game-card-grid a,
			.game-card-grid a img,
			.hero-play,
			.hero-dot::after {
				transition: none;
			}
			.hero-track {
				scroll-behavior: auto;
			}
		}

		.game-frame {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			z-index: 3;
			display: flex;
			flex-direction: column;
			width: min(100vw, calc(100vh * 4 / 7));
			height: min(100vh, calc(100vw * 7 / 4));
			background: #eee;
		}

		@supports (height: 100dvh) {
			.game-frame {
				width: min(100vw, calc(100dvh * 4 / 7));
				height: min(100dvh, calc(100vw * 7 / 4));
			}
		}

		@media (max-width: 700px) {
			.game-frame {
				top: 0;
				left: 0;
				right: auto;
				bottom: auto;
				width: 100vw;
				height: 100vh;
				box-sizing: border-box;
				transform: none;
				padding:
					env(safe-area-inset-top)
					env(safe-area-inset-right)
					env(safe-area-inset-bottom)
					env(safe-area-inset-left);
			}
		}

		html.game-open,
		html.game-open body {
			overflow: hidden;
		}

		body.game-open {
			position: fixed;
			top: var(--game-scroll-offset);
			width: 100%;
		}

		@supports (height: 100dvh) {
			@media (max-width: 700px) {
				.game-frame {
					height: 100dvh;
				}
			}
		}

		.game-backdrop {
			position: fixed;
			inset: 0;
			z-index: 2;
			background: rgba(0, 0, 0, .58);
		}

		.game-backdrop[hidden] {
			display: none;
		}

		.game-frame[hidden] {
			display: none;
		}

		.game-frame header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex: none;
			min-height: 2.5rem;
			padding: 0 .75rem;
			box-sizing: border-box;
			background: #333;
			color: white;
			font-size: .9rem;
		}

		.game-frame button {
			padding: .15rem .5rem;
			border: 0;
			background: transparent;
			color: inherit;
			font-size: 1.5rem;
			line-height: 1;
			cursor: pointer;
		}

		.game-frame iframe {
			flex: 1;
			width: 100%;
			min-height: 0;
			border: 0;
			background: white;
		}

	</style>
</head>
<body>
	<main class="layout-full game-books">
		<section class="hero" aria-roledescription="carousel" aria-label="Featured games">
			<div class="hero-track" tabindex="-1"></div>
			<button class="hero-arrow prev" type="button" aria-label="Previous game">&#8249;</button>
			<button class="hero-arrow next" type="button" aria-label="Next game">&#8250;</button>
			<div class="hero-dots"></div>
		</section>

<!-- 		<h2 class="section-title">All games</h2>
 -->		<div class="game-card-grid"></div>
		<footer class="home-footer">
			<span>Send feedback to <a href="mailto:digitalfunmedia@gmail.com?subject=LDS%20Games">digitalfunmedia@gmail.com</a></span>
			<span id="disable-analytics">&nbsp;</span>
			<span>Temple images provided by <a href="https://www.etsy.com/shop/BringTheTempleHome" target="_blank" rel="noopener noreferrer">Bring The Temple Home</a></span>
		</footer>

		<div class="game-backdrop" hidden></div>
		<section class="game-frame" aria-label="Game" hidden>
			<header>
				<strong class="game-frame-title"></strong>
				<button class="game-frame-close" type="button" aria-label="Close game">&times;</button>
			</header>
			<iframe title="Game content"></iframe>
		</section>
	</main>

	<script>

    window.oncontextmenu = function() { return false }

		const gameFrame = document.querySelector('.game-frame')
		const gameBackdrop = document.querySelector('.game-backdrop')
		const gameFrameTitle = document.querySelector('.game-frame-title')
		const gameFrameContent = document.querySelector('.game-frame iframe')
		let activeGameLink
		let pageScrollY = 0

		const games = [
			{
				title: 'Gospel Word Search',
				href: './wordSearch/index.html',
				image: './wordSearch/icon.png',
				description: 'Find hidden words in Gospel themed puzzles'
			},
			{
				title: 'Pioneer Quest',
				href: './quest/index.html',
				image: './quest/quest.jpg',
				description: 'Test your trivia as you travel across the plains'
			},
			{
				title: 'Temple Photo Puzzles',
				href: './photoPuzzle/index.html',
				image: './photoPuzzle/icon.png',
				description: 'Unscramble temple photos to complete the puzzle'
			},
			{
				title: 'Gospel Crossword',
				href: './crossword/crossword.html',
				image: './crossword/crossword.jpg',
				description: 'Test your knowledge with crosswords'
			},
			{
				title: 'Gospel Letter Scramble',
				href: './scramble/letter-scramble.html',
				image: './scramble/letter-scramble.jpg',
				description: 'Unscramble Gospel related words and phrases'
			},
			{
				title: 'Scripture Books',
				href: './scriptureBooks/standard_works.html',
				image: './scriptureBooks/books.png',
				description: 'Learn the books of scripture'
			},
			{
				title: 'Temple Jigsaws',
				href: './jigsaws/jigsaws.html',
				image: './jigsaws/jigsaws.png',
				description: 'Piece together temple scenes'
			}
		]

		/* ---------- Game grid ---------- */

		const gameCardGrid = document.querySelector('.game-card-grid')
		games.forEach(function(game) {
			const link = document.createElement('a')
			link.href = game.href
			link.dataset.title = game.title

			const image = document.createElement('img')
			image.src = game.image
			image.alt = ''

			const title = document.createElement('strong')
			title.textContent = game.title

			const description = document.createElement('span')
			description.className = 'game-card-description'
			description.textContent = game.description

			link.append(image, title, description)
			gameCardGrid.append(link)
		})

		/* ---------- Hero carousel ---------- */

		const hero = document.querySelector('.hero')
		const heroTrack = hero.querySelector('.hero-track')
		const heroDots = hero.querySelector('.hero-dots')
		const heroSlides = []
		const heroDotButtons = []
		let heroIndex = 0
		let heroTimer
		let heroPaused = false
		const heroInterval = 6000
		const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)')

		games.forEach(function(game, i) {
			const slide = document.createElement('div')
			slide.className = 'hero-slide'
			slide.setAttribute('role', 'group')
			slide.setAttribute('aria-roledescription', 'slide')
			slide.setAttribute('aria-label', (i + 1) + ' of ' + games.length)

			const bg = document.createElement('img')
			bg.className = 'hero-bg'
			bg.src = game.image
			bg.alt = ''
			bg.setAttribute('aria-hidden', 'true')

			const copy = document.createElement('div')
			copy.className = 'hero-copy'

			const eyebrow = document.createElement('span')
			eyebrow.className = 'hero-eyebrow'
			eyebrow.textContent = 'Play now'

			const heading = document.createElement('h2')
			heading.className = 'hero-heading'
			heading.textContent = game.title

			const description = document.createElement('p')
			description.className = 'hero-description'
			description.textContent = game.description

			const play = document.createElement('a')
			play.className = 'hero-play'
			play.href = game.href
			play.dataset.title = game.title
			play.textContent = 'Play ' + game.title + ' \u2192'

			copy.append(eyebrow, heading, description, play)

			const art = document.createElement('div')
			art.className = 'hero-art'
			const artImage = document.createElement('img')
			artImage.src = game.image
			artImage.alt = ''
			if (i > 0) artImage.loading = 'lazy'
			art.append(artImage)

			slide.append(bg, copy, art)
			heroTrack.append(slide)
			heroSlides.push(slide)

			const dot = document.createElement('button')
			dot.type = 'button'
			dot.className = 'hero-dot'
			dot.setAttribute('aria-label', 'Show ' + game.title)
			dot.addEventListener('click', function() { goToSlide(i) })
			heroDots.append(dot)
			heroDotButtons.push(dot)
		})

		function updateActiveSlide(index) {
			heroIndex = index
			heroSlides.forEach(function(slide, i) {
				const active = i === index
				const playLink = slide.querySelector('.hero-play')
				playLink.tabIndex = active ? 0 : -1
				slide.setAttribute('aria-hidden', active ? 'false' : 'true')
				heroDotButtons[i].setAttribute('aria-current', active ? 'true' : 'false')
			})
		}

		function goToSlide(index) {
			const count = games.length
			const next = (index + count) % count
			heroTrack.scrollTo({ left: next * heroTrack.clientWidth })
			updateActiveSlide(next)
		}

		let scrollFrame
		heroTrack.addEventListener('scroll', function() {
			cancelAnimationFrame(scrollFrame)
			scrollFrame = requestAnimationFrame(function() {
				const width = heroTrack.clientWidth
				if (!width) return
				const index = Math.round(heroTrack.scrollLeft / width)
				if (index !== heroIndex) updateActiveSlide(index)
			})
		})

		window.addEventListener('resize', function() {
			heroTrack.style.scrollBehavior = 'auto'
			heroTrack.scrollLeft = heroIndex * heroTrack.clientWidth
			heroTrack.style.scrollBehavior = ''
		})

		hero.querySelector('.hero-arrow.prev').addEventListener('click', function() { goToSlide(heroIndex - 1) })
		hero.querySelector('.hero-arrow.next').addEventListener('click', function() { goToSlide(heroIndex + 1) })

		hero.addEventListener('keydown', function(event) {
			if (event.key === 'ArrowLeft') { goToSlide(heroIndex - 1) }
			else if (event.key === 'ArrowRight') { goToSlide(heroIndex + 1) }
		})

		function startHeroTimer() {
			stopHeroTimer()
			if (reducedMotion.matches) return
			heroTimer = setInterval(function() {
				if (heroPaused || document.hidden || document.body.classList.contains('game-open')) return
				goToSlide(heroIndex + 1)
			}, heroInterval)
		}

		function stopHeroTimer() {
			clearInterval(heroTimer)
		}

		function pauseHero() { heroPaused = true }
		function resumeHero() { heroPaused = false; startHeroTimer() }

		hero.addEventListener('mouseenter', pauseHero)
		hero.addEventListener('mouseleave', resumeHero)
		hero.addEventListener('focusin', pauseHero)
		hero.addEventListener('focusout', resumeHero)
		hero.addEventListener('touchstart', pauseHero, { passive: true })
		hero.addEventListener('touchend', function() { setTimeout(resumeHero, heroInterval) }, { passive: true })

		updateActiveSlide(0)
		startHeroTimer()

		/* ---------- Game modal ---------- */

		document.querySelector('.game-books').addEventListener('click', function(event) {
			const link = event.target.closest('a[data-title]')
			if (!link) return

			event.preventDefault()
			activeGameLink = link
			pageScrollY = window.scrollY
			gameFrameTitle.textContent = link.dataset.title
			gameFrameContent.src = link.href
			gameFrameContent.title = link.dataset.title
			gameBackdrop.hidden = false
			gameFrame.hidden = false
			document.body.style.setProperty('--game-scroll-offset', '-' + pageScrollY + 'px')
			document.body.classList.add('game-open')
			document.documentElement.classList.add('game-open')
		})

		document.querySelector('.game-frame-close').addEventListener('click', function() {
			gameFrame.hidden = true
			gameBackdrop.hidden = true
			gameFrameContent.src = 'about:blank'
			document.body.classList.remove('game-open')
			document.body.style.removeProperty('--game-scroll-offset')
			document.documentElement.classList.remove('game-open')
			window.scrollTo(0, pageScrollY)
			if (activeGameLink) activeGameLink.focus({preventScroll: true})
		})

		const disableAnalytics = document.querySelector('#disable-analytics')
		if (localStorage.getItem('va-disable') === '1') {
			disableAnalytics.textContent = 'Analytics disabled'
		}

		disableAnalytics.addEventListener('click', function() {
			localStorage.setItem('va-disable','1')
			alert('Analytics disabled. You may need to reload the page for this to take effect.')
		})

	</script>

</body>
</html>
