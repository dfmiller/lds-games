<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LDS Games - Free Online Games and Puzzles</title>
  <meta name="description" content="Play free online games and puzzles, including Sudoku, Mahjong, Word Search, and more. No downloads or login required.">
  <meta name="theme-color" content="#12304a">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Showcase">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  
  <script defer src="vercel-analytics.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand">
      <img src="icons/icon-192.png" width="32" height="32" alt="" aria-hidden="true" /> LDS Games
    </a>
    <button id="install" class="install" type="button" hidden>Install app</button>
    <nav class="favs" id="favs" aria-label="Favorite games" hidden>
      <div class="favs__list" id="favsList"></div>
    </nav>
  </header>

  <main>
    <h1 class="sr-only">Featured apps</h1>

    <section id="carousel" class="carousel" aria-roledescription="carousel" aria-label="Featured apps">
      <div class="viewport" id="viewport"></div>

      <button class="arrow prev" type="button" aria-label="Previous app">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="arrow next" type="button" aria-label="Next app">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="dots" role="group" aria-label="Choose an app"></div>
      <p class="sr-only" id="status" aria-live="polite"></p>
    </section>

    <div class="page">
      <aside class="rail"></aside>

      <section class="mosaic" id="mosaic" aria-labelledby="mosaic-title">
        <h2 class="sr-only" id="mosaic-title">All Games</h2>
        <div class="mosaic__grid" id="mosaicGrid">
          <div class="search">
            <svg class="search__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20 20l-4-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            <input id="gameSearch" class="search__input" type="search" placeholder="Search games" aria-label="Search games" aria-controls="mosaicGrid" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
          </div>
        </div>
        <p class="mosaic__empty" id="mosaicEmpty" hidden>No games match your search.</p>
        <p class="sr-only" id="searchStatus" aria-live="polite"></p>
      </section>

      <aside class="rail"></aside>
    </div>

    <noscript><p class="nojs">Turn on JavaScript to browse the apps.</p></noscript>
  </main>

  <footer class="footer" id="footer">
    <small>&copy; <span id="year">2026</span><span class="footer__full"> LDS Games. All rights reserved.</span></small>
    <a href="privacy.html">Privacy Policy</a>
    <a href="mailto:digitalfunmedia@gmail.com">Contact Us</a>
  </footer>

  <script src="apps.js"></script>
  <script src="app.js"></script>
</body>
</html>
