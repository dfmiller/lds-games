<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">
		<link rel="stylesheet" type="text/css" href="../dialog.css">
		<title>Pioneer Quest</title>
		<style>

			html, body {
				width: 100%; height: 100%;
				padding: 0; margin: 0;
				overflow: hidden;
				text-align: center;
				position: relative;
				background: url(./tokirtland.jpg);
				background-size: cover;
				background-size: contain;
				background-repeat: no-repeat;
				background-position: center bottom;
				background-color: #D4C9B7;

				font-family: Arial, sans-serif;
				font-size: 4vmin;
				/*height: calc(100vh - 50px);*/
			}

			/*@media (max-height: 400px) {
				html, body { height: calc(100vh - 32px); }
			}

			@media (min-height: 720px) {
				html, body { height: calc(100vh - 90px); }
			}*/

			button {
				font-size: .8rem;
			}

			.tokirtland { background-image: url(./tokirtland.jpg); }
			.tomissouri { background-image: url(./tomissouri.jpg); }
			.tosaltlake { background-image: url(./tosaltlake.jpg); }
			.tothewest { background-image: url(./tothewest.jpg); }


			b {
				font-size: 14px;
				border: 1px solid;
				padding: 5px;
			}

			.flex-row { display: flex; flex-direction: row; }

			.space-evenly { justify-content: space-evenly; }
			.space-between { justify-content: space-between; }

			.button-wrapper {
				margin: 0 -14px;
			}

			button[disabled] {
				opacity:.5;
				text-decoration:line-through;
			}

			meter {
				height: 2vh;
				border-radius:50%;
				margin: 2vh auto;
				width: 80vw;
			}

			/* Button */
			button {
				display: inline-block;
				position: relative;
				line-height: 1.25em;
				border-radius: 2px;
				background-color: #fff;
				color: #646464;
				border: none;
			}

			button[disabled] { color: #aaa; }

			dialog {
				background: transparent;
			}

			dialog form {
				background: #fff;
				margin: .5em auto;
			}

			button {
			    font-size: .8rem;
			    display: inline-block;
			    position: relative;
			    line-height: 1.25em;
			    border-radius: 2px;
			    background-color: #fff;
			    color: #646464;
			    border: none;
			}

			dialog footer button {
			    padding: 0 .25em;
			    text-transform: uppercase;
			    margin: 1.0em;
			}

            dialog.alert {
                background: radial-gradient(transparent, white);
            }

            dialog.alert form {
                margin: auto;
            }

			p {
				margin: 0;
			}


		</style>
    </head>
<body>

	<dialog class="shell">
		<form>
			<header>
				<div class="title"></div>
				<span class="flex-row space-between">
					<button type="button" class="help-skip">skip</button>
					<button type="button" class="help-eliminate">eliminate 2</button>
					<button type="button" class="help-add">add 15 sec.</button>
					<button type="button" class="help-pause">pause</button>
				</span>
			</header>
			<main>
				<p class="text-justify"></p>
				<meter value="2" min="0" max="15"></meter>
			</main>
			<footer class="buttonWrapper text-center">
				<button type="button"></button>
				<button type="button"></button>
				<button type="button"></button>
				<button type="button"></button>
			</footer>
		</form>
	</dialog>

	<script src="cordova.js"></script>
	<script src="../jquery-3.4.1.min.js"></script>

	<script src="./dialog.js"></script>

	<script src="./quest.js"></script>

	<script src="./_words.js"></script>
	<script src="./_dates.js"></script>
	<script src="./_books.js"></script>
	<script src="./_aof.js"></script>
	<script src="./_places.js"></script>
	<script src="./_leaders.js"></script>
	<script src="./_ldprophets.js"></script>
	<script src="./_nthpresident.js"></script>
	<script src="./_hymns.js"></script>
	<script src="./_women.js"></script>
	<script src="./_temples.js"></script>
	<script src="./_commandments.js"></script>
	<script src="./_glory.js"></script>

	<script>

		Quest.init()

	</script>

	<!-- script src="./index.js"></script -->
</body>
</html>
