<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<link rel="stylesheet" type="text/css" href="./dialog.css">
	<title>Photo Puzzles</title>
	<style>
	:root {
		/* The board is the largest square that fits, leaving room for nav, header and footer */
		--board: min(100vw, calc(100vh - 9rem));
		--board: min(100vw, calc(100dvh - 9rem));
	}

	html, body {
		padding: 0; margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		font-family: sans-serif;
		font-size: clamp(14px, 4vw, 20px);
		background: #000;
		-webkit-user-select: none;
		user-select: none;
	}

	.main {
		display: flex;
		flex-direction: column;
		width: 100%;
		height: 100vh;
		height: 100dvh;
		background: black;
		color: white;
	}

	.navigation {
		display: flex;
		align-items: center;
		box-sizing: border-box;
		white-space: nowrap;
		padding-right: 1em;
		background: #444;
		flex: none;
	}

	.header {
		display: flex;
		flex-direction: row;
		flex: 1 1 0;
		min-height: 0;
		align-items: stretch;
		justify-content: space-evenly;
		padding: .5em 0;
		box-sizing: border-box;
		background: black;
		color: white;
	}

	.header > div {
		display: flex;
		align-items: center;
		justify-content: center;
		text-align: center;
	}

	.header span {
		font-size: .8rem;
		color: #888;
		display: inline-block;
	}

	.header strong {
		font-size: 2rem;
		font-weight: normal;
		display: block;
		color: white;
	}

	.footer {
		flex: none;
		height: 1.25em;
	}

	.spacer { flex: 1; }

	.preview {
		position: relative;
		flex: none;
		aspect-ratio: 1 / 1;
		overflow: hidden;
		cursor: pointer;
	}

	.preview.tap:after {
		content: 'tap to zoom';
		color: white;
		text-shadow: 0 0 3px black;
		position: absolute;
		top: 50%;
		left: 0;
		right: 0;
		display: flex;
		justify-content: center;
		align-items: center;
		background: rgba(0,0,0,.25);
		height: 1em;
		margin: -.5em 0;
		pointer-events: none;
	}

	.game-board {
		flex: none;
		width: var(--board);
		height: var(--board);
		margin: 0 auto;
		position: relative;
		touch-action: manipulation;
	}

	.game-board.step-0:before,
	.game-board.step-1:before,
	.game-board.step-2:before,
	.game-board.new-high:before,
	.game-board.puzzle-complete:before {
		position: absolute;
		top: -1.25em;
		left: 0;
		right: 0;
		z-index: 2;
		display: block;
		text-align: center;
		font-size: 1.25em;
		background: rgba(0,0,0,.8);
		color: limegreen;
		pointer-events: none;
	}
	.game-board.step-0:before { content: 'tap each square to rotate into place'; color: white; }
	.game-board.step-1:before { content: 'tap any square to begin'; color: white; }
	.game-board.step-2:before { content: 'tap another to swap them'; color: white; }
	.game-board.new-high:before { content: 'New High Score!'; }
	.game-board.puzzle-complete:before { content: 'Puzzle Complete!'; }

	.game-board:not([data-name=""])::after {
		content: attr(data-name);
		position: absolute;
		bottom: -1em;
		left: 0;
		right: 0;
		display: block;
		text-align: left;
		font-size: .8em;
		background: rgba(0,0,0,.8);
		color: white;
		padding: 0 .5em;
	}

	/* The puzzle is laid out in image pixels, then scaled with JS to fit the board */
	#squares {
		position: absolute;
		left: 0;
		top: 0;
		transform-origin: 0 0;
	}

	.img-wrapper {
		position: relative;
		overflow: hidden;
	}

	.img {
		position: absolute;
		left: 0;
		top: 0;
		transform-origin: 0 0;
		background-repeat: no-repeat;
	}

	.broken {
		outline: 4px solid white;
		outline-offset: -8px;
	}

	.broken:before {
		content: '';
		position: absolute;
		inset: 0;
		border: 4px solid black;
	}

	.square {
		position: absolute;
		display: inline-block;
		background-repeat: no-repeat;
		background-color: #444;
		transition: left .4s, top .4s, transform .5s;
	}

	.square.selected {
		outline: 8px solid #0f8;
		outline-offset: -8px;
		z-index: 1;
		animation: 1s pulsing infinite alternate;
		transform: rotate(5deg);
	}

	@keyframes pulsing {
		from { outline-color: #0f8; }
		to { outline-color: #00f; }
	}

	[class*="rotated-"]:before { display: none; }
	.rotated-0 { transform: rotate(0deg); outline: none; }
	.rotated-1 { transform: rotate(90deg); }
	.rotated-2 { transform: rotate(180deg); }
	.rotated-3 { transform: rotate(270deg); }
	.rotated-4 { transform: rotate(360deg); }
	.rotated-5 { transform: rotate(450deg); }
	.rotated-6 { transform: rotate(540deg); }
	.rotated-7 { transform: rotate(630deg); }

	#zoom {
		display: none;
		position: fixed;
		inset: 0;
		z-index: 100;
		background: rgba(0,0,0,.8);
		align-items: center;
		justify-content: center;
		cursor: zoom-out;
	}
	#zoom.open {
		display: flex;
		animation: fadein .25s;
	}
	@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

	#zoom .img-wrapper:after {
		content: 'tap anywhere to close';
		position: absolute;
		left: 0;
		right: 0;
		bottom: 0;
		text-align: center;
		color: white;
		text-shadow: 0 0 3px black;
		background: rgba(0,0,0,.4);
		pointer-events: none;
	}

	/* dialogs */
	.form-row {
		display: flex;
	}
	.form-row > label {
		font-weight: bold;
		padding: .5em;
		text-align: center;
		align-self: center;
	}

	.thumbs {
		max-height: 45vh;
		overflow: auto;
	}
	.thumbs > div {
		display: flex;
		flex-direction: row;
		flex-wrap: wrap;
		align-items: flex-start;
		justify-content: center;
		padding: 2vw;
	}
	.thumbs div span {
		display: inline-block;
		background: #000;
		margin: 6px;
		width: clamp(70px, 20vw, 130px);
		height: clamp(70px, 20vw, 130px);
		text-align: center;
		box-shadow: 1px 1px 5px black;
		overflow: hidden;
		position: relative;
		cursor: pointer;
	}
	.thumbs span img { max-height: 100%; }
	.thumbs span.selected {
		outline: 4px solid #08f;
		outline-offset: 1px;
		box-shadow: inset 2px 2px 5px black;
		animation: 1s pulsing infinite alternate;
	}

	dialog header:not(:empty) {
		font-size: 1.125rem;
		background: #ddd;
		padding: 5px;
		text-align: center;
	}
	dialog main {
		background: #eee;
		padding: 5px;
		font-size: 1.0125rem;
	}
	dialog footer {
		text-align: right;
		font-weight: bold;
		font-size: .8rem;
		background: #ddd;
		padding: 5px;
	}
	dialog select { font-size: 1.1em; padding: .2em; }
	dialog footer button[tabindex="1"] { font-size: 2em !important; padding: .2em; }
	button { font: inherit; }

	.pull-left { float: left; }
	.line-height-3 { line-height: 3em; }

	.menu-icon {
		margin: .6em 1em;
		width: 1.5em;
		height: 1em;
		background: linear-gradient(to bottom, #fff 0%, #fff 20%, transparent 20%, transparent 40%, #fff 40%, #fff 60%, transparent 60%, transparent 80%, #fff 80%, #fff 100%);
		border: none;
	}
	</style>
	<script defer src="../vercel-analytics.js"></script>
</head>
<body>

	<main class="main">
		<nav id="controls" class="navigation">
			<button type="button" class="newGame menu-icon" aria-label="New game"></button>
			<header id="logo"></header>
			<div class="spacer"></div>
			<div>Best: <span id="high_score">0</span></div>
		</nav>
		<header class="header">
			<div><span>Score: <strong id="score">0</strong></span></div>
			<div><span>Fixed: <strong id="fixed">0</strong></span></div>
			<aside class="preview tap" id="preview">
				<div id="img_wrapper" class="img-wrapper">
					<div id="img" class="img"></div>
				</div>
			</aside>
		</header>
		<article class="game-board gameBoard" id="board" data-name="">
			<div id="squares"></div>
		</article>
		<footer class="footer"></footer>
		<div id="zoom">
			<div id="zoom_wrapper" class="img-wrapper">
				<div id="zoom_img" class="img"></div>
			</div>
		</div>
	</main>

	<dialog class="helpDialog closeDialog">
		<form>
			<header>How to Play</header>
			<main>
				<p>Complete the picture by rearranging the square pieces.  Tap two pieces at a time to swap their locations.  When a piece is in the correct spot it will lock in place.</p>
			</main>
			<footer class="text-bottom">
				<button type="button" class="text-center">close</button>
			</footer>
		</form>
	</dialog>

	<dialog class="settingsDialog">
		<form>
			<header>New Game Settings</header>
			<main>
				<div class="thumbs"></div>

				<div style="text-align: center; padding: 1em;">
					Images provided by <a href="https://www.etsy.com/shop/BringTheTempleHome">Bring The Temple Home</a>
				</div>

				<div class="form-row">
					<label>Grid Size</label>
					<select class="gridSizes size-wrapper" name="gridSize"></select>
				</div>

				<div class="form-row">
					<label>Game</label>
					<select class="pickLevel">
						<option value="1">Shuffled Squares</option>
						<option value="2">Rotated Squares</option>
					</select>
				</div>
			</main>
			<footer class="text-bottom">
				<button type="reset" disabled class="pull-left line-height-3">cancel</button>
				<button type="submit" tabindex="1" class="playButton">Play</button>
			</footer>
		</form>
	</dialog>

<script src="../temples/photos.js"></script>
<script>
(function () {
	'use strict';

	const $ = (sel, root = document) => root.querySelector(sel);

	const CROP = 768; // size in image pixels of the piece of the photo used for a puzzle

	const el = {
		board: $('#board'),
		squares: $('#squares'),
		score: $('#score'),
		fixed: $('#fixed'),
		highScore: $('#high_score'),
		preview: $('#preview'),
		previewWrap: $('#img_wrapper'),
		previewImg: $('#img'),
		zoom: $('#zoom'),
		zoomWrap: $('#zoom_wrapper'),
		zoomImg: $('#zoom_img'),
		settings: $('.settingsDialog'),
		settingsForm: $('.settingsDialog form'),
		resetBtn: $('.settingsDialog button[type="reset"]'),
		playBtn: $('.playButton'),
		thumbs: $('.thumbs'),
		gridSelect: $('.gridSizes'),
		levelSelect: $('.pickLevel'),
		newGame: $('.newGame')
	};

	const store = {
		get: (key, fallback) => {
			const v = localStorage.getItem(key);
			return v === null ? fallback : v;
		},
		set: (key, value) => localStorage.setItem(key, value)
	};

	const game = {
		photos: Object.keys(local.temples),
		names: local.temples,
		srcIndexes: JSON.parse(store.get('srcIndexes', '{}')),
		gridSizes: [3, 4, 5, 6, 7, 8, 9],
		gridSize: Number(store.get('gridSize', 5)),
		highScore: Number(store.get('highScore', 0)),
		level: Number(store.get('photoGame', 1)),

		// state of the puzzle currently on the board
		squares: [],
		els: [],
		squareSize: 0,
		total: CROP,
		fixed: 0,
		score: 0,
		first: -1
	};

	/* ---------- sizing ---------- */

	function fitImage(wrap, img, size) {
		size = Math.max(0, Math.floor(size));
		wrap.style.width = wrap.style.height = size + 'px';
		img.style.width = img.style.height = game.total + 'px';
		img.style.transform = 'scale(' + (size / game.total) + ')';
	}

	function layout() {
		// puzzle pieces are positioned in image pixels, then scaled to the board
		const boardSize = el.board.clientWidth;
		el.squares.style.transform = 'scale(' + (boardSize / game.total) + ')';

		fitImage(el.previewWrap, el.previewImg, Math.min(el.preview.clientWidth, el.preview.clientHeight));

		const zoomSize = Math.min(window.innerWidth, window.innerHeight) - 16;
		fitImage(el.zoomWrap, el.zoomImg, zoomSize);
	}

	new ResizeObserver(layout).observe(el.board);
	new ResizeObserver(layout).observe(el.preview);
	window.addEventListener('resize', layout);

	/* ---------- setup ---------- */

	function initSizes() {
		const labels = ['(easiest)', '', '(default)', '', '', '', '(hardest)'];
		game.gridSizes.forEach(function (size, i) {
			const option = document.createElement('option');
			option.value = size;
			option.textContent = size + 'x' + size + (labels[i] ? ' ' + labels[i] : '');
			el.gridSelect.appendChild(option);
		});
		el.gridSelect.value = game.gridSize;
	}

	function initSources() {
		el.thumbs.textContent = '';
		const folder = document.createElement('div');
		folder.className = 'folder-temples';
		el.thumbs.appendChild(folder);
		game.photos.forEach(createSource);
	}

	function createSource(src) {
		const span = document.createElement('span');
		const img = new Image();

		img.addEventListener('error', function () { span.remove(); });
		img.addEventListener('contextmenu', function (event) {
			event.preventDefault();
			if (confirm('Remove this Photo?')) {
				game.photos = game.photos.filter(function (s) { return s !== src; });
				span.remove();
			}
		});
		span.addEventListener('click', function () {
			el.thumbs.querySelectorAll('span.selected').forEach(function (s) { s.classList.remove('selected'); });
			span.classList.add('selected');
			game.srcIndexes.temples = Math.max(0, game.photos.indexOf(src));
			store.set('srcIndexes', JSON.stringify(game.srcIndexes));
		});

		img.src = src;
		span.appendChild(img);
		$('.folder-temples', el.thumbs).appendChild(span);
	}

	function selectThumb(index, scroll) {
		const spans = el.thumbs.querySelectorAll('.folder-temples span');
		el.thumbs.querySelectorAll('span.selected').forEach(function (s) { s.classList.remove('selected'); });
		const target = spans[index];
		if (target) {
			target.classList.add('selected');
			if (scroll) target.scrollIntoView();
		}
	}

	/* ---------- puzzle generation ---------- */

	function newSquares(count, level) {
		const squares = [];
		if (level === 2) {
			for (let i = 0; i < count; i++) squares[i] = Math.floor(Math.random() * 4 + 1);
			return squares;
		}
		for (let i = 0; i < count; i++) squares[i] = i;
		// Fisher-Yates shuffle
		for (let i = count - 1; i > 0; i--) {
			const j = Math.floor(Math.random() * (i + 1));
			[squares[i], squares[j]] = [squares[j], squares[i]];
		}
		// make sure nothing starts in the right place
		for (let i = 0; i < count; i++) {
			if (squares[i] === i) {
				const j = (i + 1) % count;
				[squares[i], squares[j]] = [squares[j], squares[i]];
			}
		}
		return squares;
	}

	function startGame() {
		el.settings.removeAttribute('open');
		el.resetBtn.removeAttribute('disabled');
		el.board.classList.remove('puzzle-complete', 'new-high');

		game.gridSize = Number(el.gridSelect.value);
		store.set('gridSize', game.gridSize);

		const gridSize = game.gridSize;
		const count = gridSize * gridSize;
		game.squareSize = Math.floor(CROP / gridSize);
		game.total = game.squareSize * gridSize;
		game.first = -1;
		game.fixed = 0;
		game.score = Number(store.get('score', 0));

		let squares = JSON.parse(store.get('squares', '[]'));
		const isNew = squares.length !== count;
		if (isNew) {
			squares = newSquares(count, game.level);
			store.set('squares', JSON.stringify(squares));
		}
		game.squares = squares;

		const src = game.photos[game.srcIndexes.temples || 0];
		el.board.setAttribute('data-name', game.names[src] || '');

		const image = new Image();
		image.onerror = function () { alert('error loading image ' + src); };
		image.onload = function () {
			const offsetx = Math.floor(Math.random() * Math.max(0, image.width - game.total));
			const offsety = Math.floor(Math.random() * Math.max(0, image.height - game.total));
			const url = 'url("' + src.replace(/"/g, '%22') + '")';
			const bgPos = (-offsetx) + 'px ' + (-offsety) + 'px';

			[el.previewImg, el.zoomImg].forEach(function (node) {
				node.style.backgroundImage = url;
				node.style.backgroundPosition = bgPos;
			});

			buildSquares(url, offsetx, offsety, isNew);
			layout();
		};
		image.src = src;
	}

	function buildSquares(url, offsetx, offsety, isNew) {
		const { gridSize, squareSize, squares, level } = game;

		el.squares.textContent = '';
		el.squares.style.width = el.squares.style.height = game.total + 'px';
		game.els = [];

		for (let i = 0; i < squares.length; i++) {
			const node = document.createElement('span');
			let classes = 'square broken';
			let x, y, squareId;

			if (level === 2) {
				x = -(i % gridSize) * squareSize - offsetx;
				y = -Math.floor(i / gridSize) * squareSize - offsety;
				if (squares[i] % 4 === 0) {
					game.fixed++;
					if (isNew) game.score++;
				} else if (isNew) {
					game.score += (4 - (squares[i] % 4)) + 1;
				}
				classes += ' rotated-' + squares[i];
				squareId = i;
			} else {
				x = -(squares[i] % gridSize) * squareSize - offsetx;
				y = -Math.floor(squares[i] / gridSize) * squareSize - offsety;
				if (i === squares[i]) {
					game.fixed++;
					classes = 'square';
				}
				squareId = squares[i];
			}

			node.className = classes;
			node.dataset.positionId = i;
			node.dataset.squareId = squareId;
			node.style.cssText =
				'left:' + (i % gridSize) * squareSize + 'px;' +
				'top:' + Math.floor(i / gridSize) * squareSize + 'px;' +
				'width:' + squareSize + 'px;height:' + squareSize + 'px;' +
				'background-image:' + url + ';' +
				'background-position:' + x + 'px ' + y + 'px;';

			game.els[squareId] = node;
			el.squares.appendChild(node);
		}

		store.set('score', game.score);
		updateStats();
	}

	function updateStats() {
		el.score.textContent = game.score;
		el.fixed.textContent = game.fixed + ' / ' + (game.gridSize * game.gridSize);
		el.highScore.textContent = game.highScore;
	}

	/* ---------- playing ---------- */

	function advanceHints() {
		const cls = el.board.classList;
		if (cls.contains('step-1')) {
			cls.remove('step-1');
			cls.add('step-2');
		} else if (cls.contains('step-2')) {
			cls.remove('step-2');
		} else if (cls.contains('step-0')) {
			cls.remove('step-0');
		}
	}

	function onSquareDown(event) {
		const node = event.target.closest('.square.broken');
		if (!node || !el.squares.contains(node)) return;

		advanceHints();

		const squareId = Number(node.dataset.squareId);
		const squares = game.squares;

		if (game.level === 2) {
			const oldRotation = squares[squareId];
			if (oldRotation === 0) return;

			const newRotation = (oldRotation + 1) % 8;
			squares[squareId] = newRotation;
			node.classList.remove('rotated-' + oldRotation);
			node.classList.add('rotated-' + newRotation);
			game.score--;
			if (newRotation % 4 === 0) game.fixed++;
			else if (newRotation % 4 === 1) game.fixed--;
		} else {
			node.classList.add('selected');

			if (game.first === -1) {
				game.first = squareId;
				return;
			}
			if (game.first === squareId) {
				node.classList.remove('selected');
				game.first = -1;
				return;
			}

			const firstId = game.first;
			const other = game.els[firstId];

			const pos1 = { left: other.style.left, top: other.style.top };
			const pos2 = { left: node.style.left, top: node.style.top };

			const pid1 = Number(other.dataset.positionId);
			const pid2 = Number(node.dataset.positionId);
			other.dataset.positionId = pid2;
			node.dataset.positionId = pid1;

			squares[pid1] = squareId;
			squares[pid2] = firstId;

			node.style.left = pos1.left;
			node.style.top = pos1.top;
			other.style.left = pos2.left;
			other.style.top = pos2.top;
			setTimeout(function () {
				node.classList.remove('selected');
				other.classList.remove('selected');
			}, 400);

			let numberFixed = 0;
			if (squareId === squares[squareId]) {
				node.classList.remove('broken');
				game.fixed++;
				numberFixed++;
			}
			if (firstId === squares[firstId]) {
				other.classList.remove('broken');
				game.fixed++;
				numberFixed++;
			}

			if (numberFixed === 0) game.score -= 1;
			else if (numberFixed === 1) game.score += 2;
			else if (numberFixed === 2) game.score += 8;

			game.first = -1;
		}

		store.set('score', game.score);
		store.set('squares', JSON.stringify(squares));
		updateStats();

		if (game.fixed === game.gridSize * game.gridSize) completePuzzle();
	}

	function completePuzzle() {
		localStorage.removeItem('squares');
		store.set('score', 0);

		el.board.classList.add(game.highScore < game.score ? 'new-high' : 'puzzle-complete');
		el.squares.querySelectorAll('.square').forEach(function (s) {
			s.classList.remove('rotated-4', 'broken');
		});

		game.highScore = Math.max(game.highScore, game.score);
		store.set('highScore', game.highScore);
		el.highScore.textContent = game.highScore;

		const done = Number(store.get('gamesCompleted', 0)) + 1;
		store.set('gamesCompleted', done);

		game.srcIndexes.temples = (game.srcIndexes.temples + 1) % game.photos.length;
		store.set('srcIndexes', JSON.stringify(game.srcIndexes));
		selectThumb(game.srcIndexes.temples, false);

		setTimeout(function () {
			el.settings.setAttribute('open', '');
			selectThumb(game.srcIndexes.temples, true);
		}, 1000);
	}

	/* ---------- events ---------- */

	function bindElements() {
		el.newGame.addEventListener('click', function () {
			el.resetBtn.removeAttribute('disabled');
			el.settings.setAttribute('open', '');
		});

		el.playBtn.addEventListener('click', function () {
			game.level = Number(el.levelSelect.value);
			store.set('photoGame', game.level);
			store.set('squares', '[]');
			store.set('score', 0);
			el.score.textContent = 0;
		});

		el.settingsForm.addEventListener('submit', function (event) {
			event.preventDefault();
			startGame();
		});

		el.resetBtn.addEventListener('click', function (event) {
			event.preventDefault();
			el.settings.removeAttribute('open');
		});

		el.preview.addEventListener('click', function () {
			el.preview.classList.remove('tap');
			layout();
			el.zoom.classList.add('open');
		});

		el.zoom.addEventListener('click', function () {
			el.zoom.classList.remove('open');
		});

		el.squares.addEventListener('pointerdown', onSquareDown);
	}

	/* ---------- init ---------- */

	function init() {
		el.levelSelect.value = game.level;
		el.board.classList.add(game.level === 2 ? 'step-0' : 'step-1');
		el.highScore.textContent = game.highScore;
		el.score.textContent = store.get('score', 0);

		initSizes();
		initSources();

		const n = game.photos.length;
		game.srcIndexes.temples = (((Number(game.srcIndexes.temples) || 0) % n) + n) % n;
		selectThumb(game.srcIndexes.temples, false);

		bindElements();
		layout();

		if (localStorage.getItem('squares')) {
			startGame();
		} else {
			setTimeout(function () { el.settings.setAttribute('open', ''); }, 1);
		}
	}

	init();
})();
</script>

</html>
